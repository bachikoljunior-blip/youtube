name: 2. 動画をつくって投稿する

# 動画を1本つくって YouTube にアップロードします。これが本番です。
#
# 【投稿頻度: 1日1本】
# 毎日 05:17(JST) に自動で作られ、その日の 19:00(JST) に公開されます。
# 手で押したいときは今まで通り Run workflow から。押した回はスケジュールとは別に1本増えます。
#
# なぜ1日1本か:
#   - 収益化の門(登録者1,000人 + 総再生4,000時間)は、10分動画・維持率40%なら
#     約6万回の再生が要る。本数を積むのが最短で、日次が実務上の上限。
#   - このリポジトリは private なので Actions の無料枠は月2,000分。
#     1回あたり25〜40分なので、日次で月750〜1,200分。2本/日は枠を超える。
#   - YouTube の投稿APIは1日6本まで(既定クォータ)なので、日次なら余裕がある。
#   - 頻度を上げるほど「量産された無個性コンテンツ」と見られる危険も上がる。
#
# 頻度を変えるなら下の cron を書き換えてください(UTC で書く点に注意):
#   隔日        "17 20 */2 * *"
#   平日のみ    "17 20 * * 1-5"
#   止める      schedule: の3行をまるごと消す
#
# 公開設定(visibility)の意味:
#   private  … 非公開のままアップロードし、その日の19時(JST)に自動で公開されます。
#               config/channel.yaml の publish_hour_jst で時刻を変えられます。
#               まだ様子を見たいならこれ。19時になる前に Studio から取り消せます。
#   unlisted … リンクを知っている人だけ見られます。自動公開はされません。
#   public   … すぐ全体公開します。
#
# 投稿済みの記録はリポジトリに持ちません。説明欄の末尾に [t:テーマID] を入れておき、
# 毎回チャンネルから読み直します。動画を消せば記録も消え、そのテーマはまた作れます。
#
# 【止めたくなったら】YouTube Studio の「コンテンツ」から削除するか、
# 非公開に戻してください。GitHub 側には動画は残りません。

on:
  schedule:
    # 毎日 05:17 JST（= 20:17 UTC）。毎時0分は混んで遅延しやすいので外している。
    # 朝のうちに作っておき、その日の19時公開に間に合わせる。
    - cron: "17 20 * * *"
  workflow_dispatch:
    inputs:
      visibility:
        description: '公開設定（スケジュール実行では channel.yaml の設定が使われます）'
        type: choice
        required: false
        default: 'private'
        options:
          - private
          - unlisted
          - public
      topic_id:
        description: 'テーマID。空なら未投稿のものから自動で選ぶ'
        required: false
        default: ''

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 必要なソフトを入れる
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            ffmpeg fonts-noto-cjk fonts-noto-cjk-extra \
            open-jtalk open-jtalk-mecab-naist-jdic hts-voice-nitech-jp-atr503-m001
          npm install -g @anthropic-ai/claude-code
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: つくって投稿する
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          GOOGLE_TTS_API_KEY: ${{ secrets.GOOGLE_TTS_API_KEY }}
          VISIBILITY: ${{ inputs.visibility }}
          TOPIC_ID: ${{ inputs.topic_id }}
        run: python -m src.pipeline

      # 投稿済みの記録はチャンネル側（説明欄の [t:...]）が持つので commit しない。
      # 変わりうるのはテーマが補充されたときの topics.yaml だけ。
      - name: 補充されたテーマを記録する
        run: |
          git config user.name  "youtube-bot"
          git config user.email "youtube-bot@users.noreply.github.com"
          git add config/topics.yaml
          if git diff --cached --quiet; then
            echo "変更なし"
          else
            git commit -m "chore: テーマを補充"
            git push
          fi

      - name: あとから確認できるように成果物を残す
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: published
          path: |
            build/**/thumbnail.jpg
            build/**/title.txt
            build/**/description.txt
            build/**/script.json
          retention-days: 30
          if-no-files-found: warn
