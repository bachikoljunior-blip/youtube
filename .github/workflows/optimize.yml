name: optimize

on:
  schedule:
    # 毎週月曜 10:00 JST（= 01:00 UTC）。先週の実績を見てトピックを入れ替える。
    - cron: "0 1 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Analyze and refresh topic pool
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python -m src.analytics

      - name: Commit topics
        run: |
          git config user.name  "youtube-bot"
          git config user.email "youtube-bot@users.noreply.github.com"
          git add config/topics.yaml
          if git diff --cached --quiet; then
            echo "変更なし"
          else
            git commit -m "chore: 実績に基づきトピックを更新"
            git push
          fi
