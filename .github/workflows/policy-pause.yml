name: policy pause guard

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-pause:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Validate files and syntax
        run: |
          test -s AUTOMATION_PAUSED.md
          test -s scripts/policy_pause.sh
          python -m py_compile src/pause_guard.py src/__init__.py src/config.py
          python - <<'PY'
          import json
          from pathlib import Path
          settings = json.loads(Path('.claude/settings.json').read_text(encoding='utf-8'))
          rendered = json.dumps(settings, ensure_ascii=False)
          assert 'scripts/policy_pause.sh' in rendered
          assert 'AUTOMATION PAUSED' in Path('AUTOMATION_PAUSED.md').read_text(encoding='utf-8')
          PY

      - name: Prove generation entry points are blocked
        run: |
          python - <<'PY'
          import importlib.util
          import sys
          from pathlib import Path

          spec = importlib.util.spec_from_file_location('pause_guard_test', 'src/pause_guard.py')
          guard = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(guard)

          original = sys.argv[0]
          try:
              sys.argv[0] = 'pipeline.py'
              try:
                  guard.enforce_current_process()
              except RuntimeError as exc:
                  assert 'AUTOMATION PAUSED' in str(exc)
              else:
                  raise AssertionError('pipeline.py was not blocked')

              sys.argv[0] = 'status.py'
              guard.enforce_current_process()
          finally:
              sys.argv[0] = original
          print('pause guard passed')
          PY

      - name: Verify explicit override is narrow and intentional
        env:
          ALLOW_POLICY_PAUSED_AUTOMATION: I_ACCEPT_YPP_POLICY_RISK
        run: |
          python - <<'PY'
          import importlib.util
          import sys
          spec = importlib.util.spec_from_file_location('pause_guard_override_test', 'src/pause_guard.py')
          guard = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(guard)
          sys.argv[0] = 'pipeline.py'
          guard.enforce_current_process()
          print('explicit one-process override recognized')
          PY
