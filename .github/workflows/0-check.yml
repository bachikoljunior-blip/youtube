name: 0. 設定をチェックする

# 鍵がそろっているか、外部サービスに繋がるかだけを見ます。
# 動画は作りませんし、YouTube には何も投稿しません。何度でも実行して構いません。
#
# 初回セットアップの直後と、「投稿がなぜか失敗する」ときに最初に押すのがこれです。
# 足りないものが一覧で出るので、そこだけ直してください。
#
# 必要な Secret（5つ）:
#   CLAUDE_CODE_OAUTH_TOKEN … 手元で `claude setup-token` を実行して取得
#   YT_CLIENT_ID / YT_CLIENT_SECRET / YT_REFRESH_TOKEN … Google Cloud + 初回OAuth
#   GOOGLE_TTS_API_KEY … Google Cloud の API キー
#   PEXELS_API_KEY … Pexels の無料キー

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 必要なソフトを入れる
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            ffmpeg fonts-noto-cjk fonts-noto-cjk-extra \
            open-jtalk open-jtalk-mecab-naist-jdic hts-voice-nitech-jp-atr503-m001
          npm install -g @anthropic-ai/claude-code
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: チェックを実行
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          GOOGLE_TTS_API_KEY: ${{ secrets.GOOGLE_TTS_API_KEY }}
        run: python scripts/preflight.py
