name: publish

on:
  schedule:
    # 08:00 JST（= 23:00 UTC）。動画を作って、その日の19:00 JST公開で予約する。
    - cron: "0 23 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "アップロードせずに生成だけ試す"
        type: boolean
        default: false

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-noto-cjk fonts-noto-cjk-extra

      - name: Install python deps
        run: pip install -r requirements.txt

      - name: Build and upload
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          GOOGLE_TTS_API_KEY: ${{ secrets.GOOGLE_TTS_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: python -m src.pipeline

      - name: Commit state
        if: ${{ inputs.dry_run != true }}
        run: |
          git config user.name  "youtube-bot"
          git config user.email "youtube-bot@users.noreply.github.com"
          git add config/topics.yaml state/
          if git diff --cached --quiet; then
            echo "変更なし"
          else
            git commit -m "chore: 投稿済みトピックを記録"
            git push
          fi

      - name: Upload artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-debug
          path: |
            build/**/*.ass
            build/**/final.mp4
            build/**/thumbnail.jpg
          retention-days: 3
          if-no-files-found: ignore
