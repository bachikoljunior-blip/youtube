name: 3. テーマを実績から入れ替える

# 直近28日の YouTube アナリティクスを読んで、伸びたテーマの近くに寄せた
# 新しい企画を config/topics.yaml に足します。
#
# いつ押すか: 週に1回くらい。動画が4本以上たまってからでないと、
# 比べる相手がいないので意味のある判断ができません。
# それまでは config/topics.yaml を自分で編集して足すほうが早いです。
#
# 実績が足りないときは何も足さずに終わります。空振りしても害はありません。

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 必要なソフトを入れる
        run: |
          npm install -g @anthropic-ai/claude-code
          pip install -r requirements.txt

      - name: 実績を読んでテーマを更新
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python -m src.analytics

      - name: 更新を記録する
        run: |
          git config user.name  "youtube-bot"
          git config user.email "youtube-bot@users.noreply.github.com"
          git add config/topics.yaml
          if git diff --cached --quiet; then
            echo "変更なし"
          else
            git commit -m "chore: 実績に基づきテーマを更新"
            git push
          fi
