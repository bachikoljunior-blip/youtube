name: 1. 動画をつくる（投稿しない）

# 台本づくりから動画の書き出しまでをやって、YouTube には投稿せずに止めます。
# できたものは実行結果ページの一番下「Artifacts」からダウンロードできます。
# スマホからでも落として再生できるので、PC は要りません。
#
# 何を確認するか:
#   - 動画の長さが 8分半を超えているか（超えていないとミッドロール広告が入りません）
#   - 台本の数字や制度の説明が間違っていないか
#   - サムネの文字が小さい画面でも読めるか
#
# 内容に納得したら「2. 動画をつくって投稿する」を、同じ topic_id で実行してください。
# ここで作った動画そのものは投稿には使われず、作り直しになります。
# 台本は毎回書き下ろしなので、同じテーマでも文面は変わります。

on:
  workflow_dispatch:
    inputs:
      topic_id:
        description: 'テーマID(config/topics.yaml の id)。空ならスコアが一番高い未使用テーマ'
        required: false
        default: ''

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 必要なソフトを入れる
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-noto-cjk fonts-noto-cjk-extra
          npm install -g @anthropic-ai/claude-code
          pip install -r requirements.txt

      - name: 動画をつくる
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GOOGLE_TTS_API_KEY: ${{ secrets.GOOGLE_TTS_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          TOPIC_ID: ${{ inputs.topic_id }}
          DRY_RUN: "true"
        run: python -m src.pipeline

      # 失敗しても、途中まで出来たものは持ち帰れるようにしておく
      - name: 成果物を Artifacts に置く
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preview
          path: |
            build/**/final.mp4
            build/**/thumbnail.jpg
            build/**/title.txt
            build/**/description.txt
            build/**/script.json
            build/**/subtitles.ass
          retention-days: 7
          if-no-files-found: warn
