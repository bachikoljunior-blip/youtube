[pytest]
testpaths = tests
markers =
    live: 生きている道具（`studio/` と親の手続き）の信号。
          `python -m pytest -m live -q` は **2026-09-19 23:0x の実測で 327秒（5分27秒）**
          ・2,600件（deselected 7,066・収集 9,683）。
          **この行は「15秒」と書いてありました** —— 印を付けた回の数がそのまま残り、
          その後 件数が増えても直されていません（この repo でいちばん多い壊れ方 ＝
          言っている所と、している所が別。derivation は `docs/JOURNAL.md` 2026-09-19 22:3x §12）。
          **次に秒数が 2倍 ずれたら、写さずに撃って書き直すこと。**
          印は `conftest.py` が機械で付ける（決めているのは `studio/livetests.py`）。
          旧道具ごと全部 撃つのは `python -m pytest tests/ -q` —— **「約9分」も古い字でした**:
          同じ回に 1,700秒（28.3分）の窓で 2度 撃って、**2度とも終わらず SIGTERM**。
          ＝ **1周（床 97分）の中で全部を撃つのは、いまの件数では現実的ではありません。**
          **周ごとの信号は `-m live` のほう**を使うこと（5分27秒でそろう）。
