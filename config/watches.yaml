# **待ちの条件の台帳。** 読むのは `src/watches.py`、出すのは `scripts/status.py`。
#
# ここに書く待ちは、**必ず数で書くこと。** 「本が出れば測れる」ではなく
# 「8/23 以降の公開が3本、かつその日の実データが届いている」まで落とす。
# 数にならない待ちは、**満ちたことに誰も気づけません**（それが 8/10〜8/20 に
# `scripts/retention.py` で実際に起きたことです。理由は `src/watches.py` の冒頭）。
#
# 満ちた待ちは `answered:` に1行（日付と答え）を入れるまで毎回鳴ります。
# **「見た」では消えません。消すには判定するしかない形にしてあります。**
#
#   id       短い名前（画面に出る）
#   what     何が待っているか（どの判定・どの仮説か）
#   cond     満ちる条件を人の言葉で
#   then     満ちたら何を走らせるか
#   source   その待ちが書いてある場所
#   kind     `src/watches.py` の KINDS のどれか ＋ その引数
#   answered 満ちて、判定し終えたなら、日付と答えを1行

