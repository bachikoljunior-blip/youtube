      **つまり公開済み5本と同じ群で、8/19 までに engaged が出そろう。**

          旧設計 11本 = 公開済み5本（8/4〜8/9）＋ 予約6本（8/10〜8/15）
          A群     3本 = 8/16〜18（30秒・旧冒頭）
          B群     3本 = 8/19〜21（30秒・新冒頭22文字）

      **反証条件の「既存5本の中央値34.8%」は、11本の中央値に置き換えて判定する。**
      既存5本は 11.8〜44.2% とばらつきが大きく、**n=5 の中央値は弱い。**
      11本なら同じ設計の母数が倍以上になり、A群3本との比較が締まる。
      **34.8% という数字に固執しないこと。** 11本で引き直した中央値を使う。

