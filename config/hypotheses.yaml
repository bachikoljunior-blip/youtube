# 検証していない前提と、その反証の期限。
#
# なぜ要るか。**推測は、期限を切らないと永久に推測のまま残る。**
# これまで「効くはず」で進めた判断がいくつもあり、どれも検証されていない。
# JOURNAL に書くだけでは読み飛ばされるので、scripts/status.py が毎回出す。
#
# 期限を過ぎたものは status.py が目立つ形で出す。そこで必ず判定すること。
# 「まだ分からない」で延ばすなら、延ばす理由と新しい期限を書き直すこと。
#
# **しきい値は必ず掛け算してから置くこと。** 一度、登録率の検証しきい値を
# 「100再生」と勘で置いた。登録率0.3%なら100再生の期待値は0.3人で、
# 0人でも何も否定できない。**検出できない条件を反証条件にしてはいけない。**
#
#   claim        いま前提にしていること
#   deadline     判定する日（JST）
#   falsified_if これが起きていたら外れ、とみなす条件。**数字で書くこと**
#   next_if_false 外れていたら次に試すこと。順番に

hypotheses:
  - claim: "ショートの最後で「このチャンネルが何をする場所か」を言うと登録につながる"
    deadline: "2026-08-09"
    falsified_if: "誘導を変えた後のショートが計3000再生に達した時点で、登録率が0.1%を下回っている"
    verdict: >
      **外れ（2026-08-08 に前倒しで確定）。**
      誘導を変えた後の3本は 774＋1508＋438 = **2720再生で登録0人。**
      チャンネルの登録者1人は 8/5、誘導を変える**前**に入ったもの。

      反証条件は「3000再生で0.1%未満」で、まだ2720。だが**前倒しで判定した。**
      8/9 の1本を足しても計3700前後で、0.1%に届くには**4人**要る。
      2720で0人だった母集団から4人出る目はない。**待っても結論は変わらない。**

      **さらに重要なのは、この実験の枠そのものが小さすぎたこと。**
      仮に 0.1% を達成できたとしても、1日800再生では1000人まで**3.4年**。
      「誘導の文言を変える」系の実験は、**どれだけ当たっても目標に届かない。**
      次は文言ではなく、**桁**を動かす実験に移る（下の「天井」の仮説）。
    next_if_false:
      - "**やめた。** 下の2つは、当たっても3.4年。桁が足りない"
      - "（旧）長尺への誘導を1本試す（ショート単体で登録させるのをやめる）"
      - "（旧）チャンネル概要と再生リストを、ショートから来た人向けに書き直す"
    note: >
      **しきい値を100→3000に直した（2026-08-04）。** 登録率0.3%なら
      100再生の期待値は0.3人で、0人でも何も否定できない。検出できない条件を
      反証条件にしていた。3000再生なら期待9人なので、0人ならさすがに否定できる。

      **前の仮説（「次に何の数字が得られるか」を予告する）は外れた（2026-08-07）。**
      平均視聴率 51〜102% で最後まで見られているのに、**856人で登録0人。**
      一般的な0.5%なら期待4.3人。**1本の続きを示しても、チャンネルを登録する
      理由にはならない。** 「この場所で毎回何が手に入るか」に変えた。

      **反証条件を「0人か否か」から「率」に置き直した（2026-08-07）。**
      0人かどうかでは、1人いれば通ってしまう。**通っても目標に届かないなら、
      それは検出できていないのと同じ。** 0.1%は「1000人に100万再生」の線で、
      1日1000再生なら約2.7年。それでも遅いが、0.036%（7.6年）とは桁が違う。

      **途中経過（2026-08-05 21:00）: ショート計2133再生で登録者1人。**
      まだ反証条件（3000再生で0人）には当たらないが、**率は0.047%で、
      仮に置いた0.3%の7分の1**。この率のままなら1000人に必要なのは
      **210万再生**で、0.3%前提の33万再生とは桁が違う。
      8/9 の判定では「0人か否か」だけでなく**率そのもの**を見ること。

  - claim: "1245再生は「1日1本」の効果であって、「年金」という題の効果ではない"
    deadline: "2026-08-09"
    verdict: >
      **半分あたり、半分外れ（2026-08-07 確定）。** 残業代が24時間で680回。
      反証条件の300を大きく上回ったので「配信されるかどうかは題によらない」。
      だが年金は同じ24時間で1257で、**1.85倍の差がある。**
      **配信の有無は本数、伸びの量は題**、という結論。
    falsified_if: "8/6・8/7・8/8 の3本（残業代・年末調整・住宅ローン控除）が、公開24時間後にどれも300再生未満"
    next_if_false:
      - "題そのものが効いていると考える。年金・老後・退職金に寄せて3本試す"
      - "それでも駄目なら、切り口ではなく形式（音声・画・冒頭2秒）を疑う"
    note: >
      **交絡を切るために組んだ実験（2026-08-05）。** 8/5 に1本だけ出した
      m74wgCTi2n0（年金の繰下げ）が1245再生。だが同じ日に「1日1本」と
      「年金という題」が同時に変わっているので、どちらの効果か分からない。

      **条件をそろえた。** 8/6・8/7・8/8 に毎朝9時、1日1本ずつ、
      **年金以外の題**で出す（残業代・年末調整・住宅ローン控除）。
      公開時刻も本数も 8/5 と同じ。**変えたのは題だけ。**

      しきい値は掛け算して置いた。8/4 の固め出しでの最良が558、後発3本が0。
      8/5 の1本が1245。**題が無関係なら3本とも4桁前後に出るはず**なので、
      300未満が3本続けば「題の効果だった」と言える。
      300は 8/4 の最良558の半分強で、ばらつきを見込んでも下回りにくい線。

      **1本目の途中経過（2026-08-06 15:15）: 残業代が6時間で383回。**
      24時間を待たずに反証条件（300未満）を上回った。**年金以外の題でも配信される。**
      ただし量では年金が強い（年金は12時間で1245、残業代は6時間で383）。
      **「配信されるかどうか」は題によらない。「どれだけ伸びるか」は題で変わる**
      というのが、いまのところ一番素直な読み。残り2本で確かめる。

