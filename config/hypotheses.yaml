  - claim: "1本あたりの再生数が300〜1500に収まっているのは中身のせいで、天井ではない"
    deadline: "2026-08-15"
    falsified_if: "8/9〜8/15 の7本のうち、24時間で3000再生を超えるものが1本も無い"
    verdict: >
      **外れ（2026-08-15 に期限どおり確定）。天井です。**

      対象の7本（この窓のショート全部。長尺3本は別勘定）と、24時間時点の再生:

          SsUYduA1dpg  8/09 09:00   934（24.4h）
          7NtIDFiPrsw  8/10 09:00  1229（24.3h）
          drkKm9fHW2M  8/11 09:00   821（24.4h）
          gPusj-Y2404  8/12 09:00  1338（12.5h）
          aUYYSN4pLMw  8/12 21:00  1327（58.7h ※24h の点が無い）
          eDhsTuVyVAw  8/13 09:00   395（現在値）
          pMHDwK5tB2E  8/14 09:00  1447（22.7h）

      **3000を超えたものは0本。** 反証条件そのままです。
      さらに、24時間に限らず**現在値でも最高は1777**（`gPusj-Y2404`）で、
      3000の6割にも届いていません。**時間を与えても超えないので、
      「24時間の窓が短すぎた」という逃げ道はありません。**

      置いたときの読み（「7本×24時間、当たり率が仮に1/7でも1本は出る勘定。
      0本なら偶然では説明しにくい」）のとおりになりました。
      実測の幅は 395〜1777 の**4.5倍**あり、中身の差はちゃんと出ています。
      **その4.5倍のばらつきを持ってしても、誰も2000に触れない。**
      これは「まだ良い中身に当たっていない」ではなく、**上限がある**と読みます。

      ## この判定が閉じるもの（ここが本体です）

      **1. M1（YouTube AdSense・この形式）は桁が足りないと確定。**
      登録者1000人の門に、実測の登録率 0.043% で **230万再生**が要ります。

          1日1本（実測 800〜1500）  → 約1500/日 → **4.2年**
          1日2本（下の M9 で成立）  → 約3000/日 → **2.1年**

      **本数を倍にしても年単位です。** ショート単独の門（90日で1000万）は
      1日11万再生が要り、**37倍。** どちらも「最短で月20万」に乗りません。

      **2. M11（登録率を上げる）の復活条件1が、これで永久に閉じました。**
      M11 は「1本あたりの再生が1桁上がれば、2倍の刻みが検出できるようになる」を
      復活条件にしていました。**その1桁上がりが起きないと今日決まった**ので、
      **この形式のままでは M11 は二度と測れません。** 残る復活条件は
      「1手で14倍を狙える案」だけです（`docs/MEANS.md` M11）。

      **3. だから中身の調整をやめます**（next_if_false の1番目）。
      冒頭・文言・数字の見せ方を刻む作業は、**4.5倍の幅の中を動くだけ**で、
      必要なのは100倍です。**予約済みの実験（8/16〜8/22）は測り終える** ——
      もう作ってあるので追加費用がゼロだからで、**新しく中身の実験を足さない。**

      **4. 残った道は「面を増やす」だけです。**
      1本あたりが天井なら、**掛ける本数か、掛ける面**しか残りません。
      本数は M9 が今日いっしょに生きたので使えます（ただし年単位）。
      面は M2（他プラットフォーム）で、**オーナーの操作が要ります。**
      A1 が「読むとは限らない」と言う以上、**これを計画の柱にはできません。**

      **つまり今日の判定は「次の一手」を指していません。**
      **自分だけで20万に届く道は、いま台帳に1つも無い**と確定しました。
      そう書くのが正直です。**無い道をあるように書かないこと。**
    next_if_false:
      - "**この形式では桁が足りない**と確定させる。中身の調整をやめる"
      - "収益をAdSense以外から取る道を試す（1000人の門を通らずに済む）"
      - "同じ計算を、露出の天井が違う面（別プラットフォーム）に出して比べる"
    note: >
      **これがいま一番大事な問いです。** 掛け算するとそうなります。

      実測6本: 311・537・774・1255・1508・438。**5倍のばらつきはあるが、
      どれも4桁の前半で止まっている。** 1日あたり約800再生。

      収益化の門は2つあり、どちらも遠い:
        - 登録者1000人 … 実測の登録率 1/4823 = **0.021%**。
          この率なら**480万再生**、1日800再生で**16年**。
          仮に0.1%まで上げても**3.4年**。
        - ショート単独の門（90日で1000万再生）… いまは90日で**7.2万再生**。
          **139倍足りない。**

      **つまり律速は登録率ではなく、1本あたりの再生数そのもの。**
      ここが100倍にならない限り、他を何倍にしても届きません。

      だから問いを「どう当てるか」から「**そもそも当たる余地があるのか**」に
      変えます。3000は実測の最良1508の約2倍。**中身の差で説明できる幅**
      （すでに5倍のばらつきがある）なので、7本中1本も超えないなら
      それは中身ではなく**天井**と読むのが素直です。

      しきい値は掛け算して置きました。7本×24時間、当たり率が仮に1/7でも
      1本は出る勘定。0本なら「たまたま」では説明しにくい。

  - claim: "推薦面（RELATED_VIDEO）は自力で伸びていて、着手できる大きさになる"
    deadline: "2026-08-22"
    falsified_if: "2026-08-22 時点で、90日窓の insightTrafficSourceType.RELATED_VIDEO が 10 未満"
    next_if_false:
      - "6 は揺らぎだったと確定させ、M12 は保留のままにする"
      - "**WATCH の伸びを「複利」と呼ぶのをやめる。**主犯が揺らぎなら複利の根拠が消える"
    note: >
      **2026-08-15 に、M12 の前提が2つとも古いと分かって置いた。**

      8/10 の M12 は「**90日間 `RELATED_VIDEO` の行そのものが返らない**＝
      ホームにも関連動画にも一度も出ていない」を前提にしていた。
      同じ問いを 8/15 に引き直したら、**6 が返った。**

          90日 SHORTS 13285 / YT_OTHER_PAGE 201 / YT_SEARCH 160
               YT_CHANNEL 135 / **RELATED_VIDEO 6** / EXT_URL 4

      **0 と 6 の差は量ではなく種類の差**（判定できる／できない）。

      そのうえ `scripts/watch_source.py` で分けたら、
      **この6が長尺への最大の流入元**だった（長尺10 の内訳は
      RELATED_VIDEO 6／EXT_URL 2／YT_SEARCH 1／YT_CHANNEL 1）。

      **M12 の着手条件が循環している。**「WATCH が1日30人になったら着手」だが、
      その WATCH を6割動かしているのが M12 の面そのもの。
      **待っていても、待っている当人以外に条件を満たす者がいない。**

      それでも 8/15 には着手しなかった。6 は小さく、ここで条件を書き直すと
      **「動いた面に後から条件を合わせる」**ことになり、8/11 に M3 で
      「WATCH を自分で動かせてしまう」と警戒したのと同じ形になるから。

      しきい値は掛けて置いた。**12日で +6 のペースなら 8/22 には約13。**
      だから「惰性で届く」13 の上に **20** を着手条件（M12 側）に置き、
      **10 未満なら揺らぎ**として外れにする。**幅の外側で判定する。**

  - claim: "WATCH（視聴ページ）の伸びは複利で、M3 の門である1日30人に届く"
    deadline: "2026-08-29"
    falsified_if: "2026-08-29 時点で、全走査の insightPlaybackLocationType.WATCH が 60 未満"
    next_if_false:
      - "M3・M12 を「保留」から「却下」に落とす。**自分だけで届く手段が台帳から全部消えます**"
      - "そう書く。**空になった台帳を、空のまま JOURNAL に残すこと。**候補を埋めるために弱い手を足さない"
      - "残るのは M2（他プラットフォーム＝オーナーの操作）だけになるので、依頼の文面を一番読まれる場所に置き直す"
    note: >
      **8/15 に「1本あたりの再生は天井」が確定した結果、残った問いはこれ1つです。**

      その日の判定で、自分だけで動かせる道は次のように絞られました。

          M1  AdSense … 1日2本でも門まで2.1年。**桁が足りないと確定**
          M11 登録率  … 復活条件が閉じた（1本あたりが1桁上がらないと決まったため）
          M2  他の面  … **オーナーの操作が要る。**A1 より計画の柱にできない
          M3  商品    … WATCH 次第 ← **ここだけ生きている**
          M12 推薦面  … 同上

      **つまり M3/M12 が死ぬと、自分だけで20万に届く手段が台帳から全部消えます。**
      だからこれは「次に何を試すか」ではなく、**「試せるものが残っているか」**の問いです。

      ## しきい値は掛け算してから置きました（8/10 の失敗を繰り返さないため）

      M3 の旧条件「WATCH が2桁」は**掛けずに置いたせいで、達成しても
      月¥3,000にしかならない数字**でした。今度は先に掛けます。

          月20万 ＝ 転換5% × ¥2,000 なら 2,000人/月 = **67人/日**
          その半分に乗る着手点            = **30人/日**（M3 の新条件）

      いまの実測は **1.9人/日**（8/10 15:24 に2 → 8/15 07:43 に11、+9/4.7日）。
      30人/日まで **16倍**です。

          線形のまま（1.9人/日）  → 8/29 に 11 + 1.9×14 ≒ **38**
          倍速で伸びる（3.5人/日）→ 8/29 に 11 + 3.5×14 ≒ **60**

      **60 を反証条件にしたのはこのためです。** 38 前後で着地したら、
      それは「伸びている」ではなく**「線形」**で、線形の 1.9人/日 は
      **30人/日に永久に届きません**（16倍を線形で埋めるには8か月かかり、
      その間に M1 の4.2年と大差がなくなります）。
      **「増えてはいるから続ける」と読まないための線です。**

      ## 割り引くところ

      **M8（再生リストで視聴ページへ出口を作る）は、こちらが構造をいじれば
      WATCH を自分で動かせてしまいます。** 8/11 に M3 の条件をきつくしたのは
      そのためでした。**判定のときは `insightTrafficSourceType.PLAYLIST` を
      必ず併せて見ること。** 8/15 時点では累計1件しかなく、
      +9 のうち再生リストで説明できるのは最大1件です。
      **PLAYLIST が増分の半分を超えていたら、その回は判定を保留すること。**

      **n が小さいことも承知しています。** 11件の観測で率を語っています。
      だからこそ**14日あけて、絶対数で見る**形にしました。

