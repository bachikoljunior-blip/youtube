# 検証していない前提と、その反証の期限。
#
# なぜ要るか。**推測は、期限を切らないと永久に推測のまま残る。**
# これまで「効くはず」で進めた判断がいくつもあり、どれも検証されていない。
# JOURNAL に書くだけでは読み飛ばされるので、scripts/status.py が毎回出す。
#
# 期限を過ぎたものは status.py が目立つ形で出す。そこで必ず判定すること。
# 「まだ分からない」で延ばすなら、延ばす理由と新しい期限を書き直すこと。
#
# **しきい値は必ず掛け算してから置くこと。** 一度、登録率の検証しきい値を
# 「100再生」と勘で置いた。登録率0.3%なら100再生の期待値は0.3人で、
# 0人でも何も否定できない。**検出できない条件を反証条件にしてはいけない。**
#
#   claim        いま前提にしていること
#   deadline     判定する日（JST）
#   falsified_if これが起きていたら外れ、とみなす条件。**数字で書くこと**
#   next_if_false 外れていたら次に試すこと。順番に

hypotheses:
  - claim: "ショートの最後に「次に何の数字が得られるか」を言うと登録につながる"
    deadline: "2026-08-09"
    falsified_if: "ショートが計3000再生を超えても登録者が0のまま"
    next_if_false:
      - "長尺への誘導を1本試す（ショート単体で登録させるのをやめる）"
      - "チャンネル概要と再生リストを、ショートから来た人向けに書き直す"
    note: >
      **しきい値を100→3000に直した（2026-08-04）。** 登録率0.3%なら
      100再生の期待値は0.3人で、0人でも何も否定できない。検出できない条件を
      反証条件にしていた。3000再生なら期待9人なので、0人ならさすがに否定できる。

      **途中経過（2026-08-05 21:00）: ショート計2133再生で登録者1人。**
      まだ反証条件（3000再生で0人）には当たらないが、**率は0.047%で、
      仮に置いた0.3%の7分の1**。この率のままなら1000人に必要なのは
      **210万再生**で、0.3%前提の33万再生とは桁が違う。
      8/9 の判定では「0人か否か」だけでなく**率そのもの**を見ること。

  - claim: "1245再生は「1日1本」の効果であって、「年金」という題の効果ではない"
    deadline: "2026-08-09"
    falsified_if: "8/6・8/7・8/8 の3本（残業代・年末調整・住宅ローン控除）が、公開24時間後にどれも300再生未満"
    next_if_false:
      - "題そのものが効いていると考える。年金・老後・退職金に寄せて3本試す"
      - "それでも駄目なら、切り口ではなく形式（音声・画・冒頭2秒）を疑う"
    note: >
      **交絡を切るために組んだ実験（2026-08-05）。** 8/5 に1本だけ出した
      m74wgCTi2n0（年金の繰下げ）が1245再生。だが同じ日に「1日1本」と
      「年金という題」が同時に変わっているので、どちらの効果か分からない。

      **条件をそろえた。** 8/6・8/7・8/8 に毎朝9時、1日1本ずつ、
      **年金以外の題**で出す（残業代・年末調整・住宅ローン控除）。
      公開時刻も本数も 8/5 と同じ。**変えたのは題だけ。**

      しきい値は掛け算して置いた。8/4 の固め出しでの最良が558、後発3本が0。
      8/5 の1本が1245。**題が無関係なら3本とも4桁前後に出るはず**なので、
      300未満が3本続けば「題の効果だった」と言える。
      300は 8/4 の最良558の半分強で、ばらつきを見込んでも下回りにくい線。

      **1本目の途中経過（2026-08-06 15:15）: 残業代が6時間で383回。**
      24時間を待たずに反証条件（300未満）を上回った。**年金以外の題でも配信される。**
      ただし量では年金が強い（年金は12時間で1245、残業代は6時間で383）。
      **「配信されるかどうか」は題によらない。「どれだけ伸びるか」は題で変わる**
      というのが、いまのところ一番素直な読み。残り2本で確かめる。

  - claim: "ショート冒頭の数字は、金額や期間のほうが倍率より効く"
    deadline: "2026-08-12"
    falsified_if: "8/10 の繰上げ（冒頭が0.76倍）が24時間で1000再生を超える"
    next_if_false:
      - "倍率・割合も冒頭に使ってよいことにする（表現の幅が広がる）"
      - "冒頭の数字より、題材そのものが効いていると考える"
    note: >
      **これは推測。** これまで冒頭に出したのは期間（31か月＝1245再生）、
      金額（還付額558・年8万円383）で、**倍率を冒頭に置いた動画はまだ無い。**
      8/10 の繰上げが `0.76倍` で出るので、そこで測れる。

      しきい値は掛け算して置いた。同じ年金題材の繰下げが1245。
      **題材の効果がそのまま出るなら4桁**になるはずなので、
      1000を超えたら「倍率でも効く」と言える。500前後なら
      題材ではなく冒頭の数字が効いている、と読める。

  - claim: "計算で独自性を出す構成なら、量産テンプレート判定を避けられる"
    deadline: "2026-09-01"
    falsified_if: "収益化を申請できる段階で、審査に落ちるか警告が出る"
    next_if_false:
      - "実画面の収録を混ぜる（まだ手をつけていない）"
      - "合成音声をやめて自分の声にする"

# 確認できたもの。**消さないこと。** 同じ問いを二度立てないための記録。
confirmed:
  - claim: "1日に配信されるショートは限られる。1本だけ出せば、その1本は配信される"
    confirmed_on: "2026-08-05"
    evidence: >
      8/5 は 09:21 に m74wgCTi2n0 を**1本だけ**出した。12時間後で**1245再生・
      高評価3**。8/4 に固めて出した後発3本が8時間0回だったのと**正反対**。
      期限は 8/6 だったが、10再生のしきい値を2桁超えたので**前倒しで判定した。**
    implication: >
      **本数ではなく1本あたりの当たり率が律速。** 1日1本なら配信は出る。
      増産は効かない（8/4 で実証済み）ので、資源は**1本の質**に振る。
      さらに 1245 は 8/4 の最良（558）の2.2倍で、**1日1本のほうが1本あたりも強い**。
      ただし切り口（年金の繰下げ）の差か本数の差かは分離できていない。
      次に効くのは「毎日1本を続けて、当たり率のばらつきを見る」こと。
  - claim: "認知ゼロのチャンネルでも、ショートにはフィードから露出が出る"
    confirmed_on: "2026-08-04"
    evidence: >
      登録者0のまま、公開2時間半で NzygRNpx8GU が256回、EanVD0YZPlo が100回。
      同じ日に出した長尺は1回。**ショートと長尺で2桁以上の差がある。**
      流入経路APIは当日ぶんを返さないので SHORTS の明示はまだ取れていないが、
      登録者0のチャンネルで256回はフィード以外に説明がつかない。
    implication: >
      律速は登録者で、露出が出る面はショートだけだと確認できた。
      **資源はショートに寄せる。** 本数を増やす先はショート。

      **2026-08-06 追記: 「長尺は総再生時間を積む役として残す」を取り消す。**
      公開後14〜38時間の長尺4本が**すべて0〜1回**。0回では何分の動画でも
      総再生時間は0時間で、**役を果たしていない。** 積めていないものを
      「積む役」と呼んでいたのは、作ったものを惜しむ気持ちでしかない。
      **新しい長尺はもう作らない。** 予約済みの2本（8/6・8/7 の19:00）は
      作成済みで害が無いので出す。長尺に戻すのは、ショートから長尺への
      流入が実測できたときだけ。

  - claim: "ショートを固めて出すと、後から出したものに露出が回らない"
    confirmed_on: "2026-08-05"
    evidence: >
      8/4 に5本を90分（18:29〜19:55）に固めて出した。8時間後の時点で
      18:29→330回、18:32→558回と**先の2本は伸び続けている**のに対し、
      19:07・19:39・19:55 の3本は**ちょうど0回**のまま。
      配信そのものは続いているので「まだ遅れているだけ」では説明しづらい。
    implication: >
      **本数を増やしても再生は増えない。** 「ショートが効く→たくさん出す」は
      成り立たない。1日に配信される本数に上限があるように見えるので、
      資源は**本数ではなく1本あたりの当たり率**に振るべき。
      ただし n=1日なので、1日1本の場合を次に確かめる。

