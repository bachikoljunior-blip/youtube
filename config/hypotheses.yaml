    note: >
      **これまで冒頭の「構造」を測ったことが一度もない。**
      登録済みの7件を見ると、尺・末尾の文言・題・登録率・天井・冒頭の数字の型…
      冒頭に触れるものは「金額と倍率のどちらが効くか」だけで、
      **画面がいつ変わるかを測るものが無かった。**

      **実測はここを指している。**

          維持率の最大の落差   4.7〜5.7秒（3本とも）
          既存の1枚目の尺      41〜72文字 ＝ 7.9〜13.8秒

      **落差の瞬間、画面はまだ一度も変わっていない。**
      競合調査（M6）も「1画面1情報」「1〜2秒ごとの視覚変化」
      「完全静止画＋一定速度の音声＋全文字幕は不利」と言っている。

      1枚目を22文字（約4.2秒）、2枚目を26文字（累計約9.2秒）に制限した。
      **落差より前に1回、9秒までに2回、画面が変わる。**

      **群を分けてある。ここが要点です。**

          8/16〜8/18  30秒・**冒頭は従来のまま**（1枚目 42〜49文字）… 尺だけを測る
          8/19〜8/21  30秒・**冒頭を22文字に**                    … 冒頭だけを測る

      両方とも30秒なので、**AとBの差は冒頭だけ。**
      8/19 の仮説（尺）は既存5本との比較、こちらは A との比較。
      **同じ3本を二度使わない。**

      **しきい値は掛け算して置いた。** 既存5本の engaged は 11.8〜44.2% と幅が広く、
      1本では判定できないので3本の中央値で見る。
      比較先を「既存5本の中央値34.8%」ではなく **A群の中央値**にしたのは、
      A群も30秒だから。**34.8% と比べると尺の効果が混ざる。**

      **予想: 当たると読む。** 8/19 のほうは外れると予想してある（尾を切っても
      1枚目は変わらないため）。**両方の予想が当たれば、
      「engaged は冒頭6秒だけで決まる」がかなり強く言える。**

      **ただし既存データはこの予想を支持していない（2026-08-10、判定前に記録）。**
      公開済みショートの1枚目の字数と engaged を突き合わせた。

          1枚目 41字 → engaged 17.3%（537再生）
          1枚目 47字 → engaged 11.9%（311再生）
          1枚目 68字 → engaged **44.4%**（1254再生）  ← 最長が最高
          1枚目 72字 → engaged 19.0%（437再生）

      **短い2本が下位2本。** 向きが予想と逆に見える。

      **それでも実験は続ける。理由は3つ。**

      1. **n=4 で、題材と完全に交絡している。** 68字は年金（実測で一番強い題材）。
         長いから伸びたのか、年金だから伸びたのか分けられない
      2. **長いほうの2本が 44.4% と 19.0% で、幅が題材の差より大きい。**
         1枚目の長さで説明できていない
      3. **仕組みの根拠は別にある。** 維持率の最大の落差は 4.7〜5.7秒で、
         旧設計の1枚目（7.9〜13.8秒）はその時点で画面が変わっていない。
         **相関ではなく、落ちている時刻そのものを見た結論**

      **判定でこの記録を使うこと。** 外れたら「既存データのほうが正しかった」
      であって、**予想が外れたこと自体は新しい情報ではない。**
      当たった場合のほうが強い（既存の相関に逆らって効いたことになる）。

      **3本ずつそろったので、群の中身を並べておく（2026-08-09、判定前）。**

          群  枚  1枚目   chart   合計字   尺              中央値
          A   5   45〜49  2〜3    137〜139  26.5〜28.8秒   28.7秒
          B   6   18〜21  1〜3    137〜139  27.7〜34.9秒   30.8秒

      **1枚目は 45〜49字 → 18〜21字。ここが変えたところ。**
      合計文字数・chart 枚数はほぼ同じで、**尺は中央値で約2秒 B が長い。**

      **この2秒は、2本目までの見立てより小さい。**
      B群が2本の時点では「30.8〜34.9秒、A より2〜8秒長い」と書いたが、
      3本目が27.7秒で入ってその読みは外れた。**2点から幅を語っていた。**

      **交絡としては保守側なので直さない。** 8/19（短いほど engaged が上がる）が
      正しいなら B群はわずかに不利で、それでも上回れば冒頭の効果は実測より大きい。
      8/19 が外れる（尺は効かない）なら、2秒差は無視してよい。
      **どちらに転んでも判定は成立する。**

      ついでに分かったこと: **「実効 4.63文字/秒」は定数ではない。**
      6本の実測で 3.93〜5.25 まで動く（枚数と読み上げ内容で変わる）。
      合計文字数から尺を出す見積もりは、**±5秒の幅があるものとして使うこと。**

      **群の途中で文字数の枠を変えないこと。** B群3本目も140文字のままにする。
      揃えるべきは尺ではなく**作り**です。

