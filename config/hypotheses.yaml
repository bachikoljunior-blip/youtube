      #
      # **`kind: external` ではありません。** 審査そのもの（申請 → 合否）は
      # こちらの手では起こせませんが、**この期限が見るのは審査ではありません** ——
      # 下の `falsified_if` が「**期限に見るのは『材料が0件のまま保たれているか』**」
      # と書いており、それは `tests/test_eligibility.py`（実測 11件・全部 緑）で
      # **いま手元のデータだけで判定できます。**
      #
      # `external` にすると `unreachable=True` になり、`[!!] 判定できる日が
      # 出せません` として**期限そのものが消えます**。そうすると
      # 「材料が0件のまま保たれているか」を誰も見なくなる ——
      # この前提が段3 に置かれている理由が、まさにそれです。
      #
      # **覆る条件**: 門1（登録者1,000人）が通って申請できる日が来たら、
      # `deadline` をその日へ引き直し、ここを `kind: external`
      # （`what: 収益化の審査の合否`）へ替えること。合否はこちらの手では動きません。
      # **`kind: now` でもありません。** 見るのは「いま0件か」ではなく
