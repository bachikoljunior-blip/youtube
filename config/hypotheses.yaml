# 検証していない前提と、その反証の期限。
#
# なぜ要るか。**推測は、期限を切らないと永久に推測のまま残る。**
# これまで「効くはず」で進めた判断がいくつもあり、どれも検証されていない。
# JOURNAL に書くだけでは読み飛ばされるので、scripts/status.py が毎回出す。
#
# 期限を過ぎたものは status.py が目立つ形で出す。そこで必ず判定すること。
# 「まだ分からない」で延ばすなら、延ばす理由と新しい期限を書き直すこと。
#
# **しきい値は必ず掛け算してから置くこと。** 一度、登録率の検証しきい値を
# 「100再生」と勘で置いた。登録率0.3%なら100再生の期待値は0.3人で、
# 0人でも何も否定できない。**検出できない条件を反証条件にしてはいけない。**
#
#   claim        いま前提にしていること
#   deadline     判定する日（JST）
#   falsified_if これが起きていたら外れ、とみなす条件。**数字で書くこと**
#   next_if_false 外れていたら次に試すこと。順番に

hypotheses:
  - claim: "ショートの最後で「このチャンネルが何をする場所か」を言うと登録につながる"
    deadline: "2026-08-09"
    falsified_if: "誘導を変えた後のショートが計3000再生に達した時点で、登録率が0.1%を下回っている"
    verdict: >
      **外れ（2026-08-08 に前倒しで確定）。**
      誘導を変えた後の3本は 774＋1508＋438 = **2720再生で登録0人。**
      チャンネルの登録者1人は 8/5、誘導を変える**前**に入ったもの。

      反証条件は「3000再生で0.1%未満」で、まだ2720。だが**前倒しで判定した。**
      8/9 の1本を足しても計3700前後で、0.1%に届くには**4人**要る。
      2720で0人だった母集団から4人出る目はない。**待っても結論は変わらない。**

      **さらに重要なのは、この実験の枠そのものが小さすぎたこと。**
      仮に 0.1% を達成できたとしても、1日800再生では1000人まで**3.4年**。
      「誘導の文言を変える」系の実験は、**どれだけ当たっても目標に届かない。**
      次は文言ではなく、**桁**を動かす実験に移る（下の「天井」の仮説）。
    next_if_false:
      - "**やめた。** 下の2つは、当たっても3.4年。桁が足りない"
      - "（旧）長尺への誘導を1本試す（ショート単体で登録させるのをやめる）"
      - "（旧）チャンネル概要と再生リストを、ショートから来た人向けに書き直す"
    note: >
      **しきい値を100→3000に直した（2026-08-04）。** 登録率0.3%なら
      100再生の期待値は0.3人で、0人でも何も否定できない。検出できない条件を
      反証条件にしていた。3000再生なら期待9人なので、0人ならさすがに否定できる。

      **前の仮説（「次に何の数字が得られるか」を予告する）は外れた（2026-08-07）。**
      平均視聴率 51〜102% で最後まで見られているのに、**856人で登録0人。**
      一般的な0.5%なら期待4.3人。**1本の続きを示しても、チャンネルを登録する
      理由にはならない。** 「この場所で毎回何が手に入るか」に変えた。

      **反証条件を「0人か否か」から「率」に置き直した（2026-08-07）。**
      0人かどうかでは、1人いれば通ってしまう。**通っても目標に届かないなら、
      それは検出できていないのと同じ。** 0.1%は「1000人に100万再生」の線で、
      1日1000再生なら約2.7年。それでも遅いが、0.036%（7.6年）とは桁が違う。

      **途中経過（2026-08-05 21:00）: ショート計2133再生で登録者1人。**
      まだ反証条件（3000再生で0人）には当たらないが、**率は0.047%で、
      仮に置いた0.3%の7分の1**。この率のままなら1000人に必要なのは
      **210万再生**で、0.3%前提の33万再生とは桁が違う。
      8/9 の判定では「0人か否か」だけでなく**率そのもの**を見ること。

  - claim: "1245再生は「1日1本」の効果であって、「年金」という題の効果ではない"
    deadline: "2026-08-09"
    verdict: >
      **半分あたり、半分外れ（2026-08-07 確定）。** 残業代が24時間で680回。
      反証条件の300を大きく上回ったので「配信されるかどうかは題によらない」。
      だが年金は同じ24時間で1257で、**1.85倍の差がある。**
      **配信の有無は本数、伸びの量は題**、という結論。
    falsified_if: "8/6・8/7・8/8 の3本（残業代・年末調整・住宅ローン控除）が、公開24時間後にどれも300再生未満"
    next_if_false:
      - "題そのものが効いていると考える。年金・老後・退職金に寄せて3本試す"
      - "それでも駄目なら、切り口ではなく形式（音声・画・冒頭2秒）を疑う"
    note: >
      **交絡を切るために組んだ実験（2026-08-05）。** 8/5 に1本だけ出した
      m74wgCTi2n0（年金の繰下げ）が1245再生。だが同じ日に「1日1本」と
      「年金という題」が同時に変わっているので、どちらの効果か分からない。

      **条件をそろえた。** 8/6・8/7・8/8 に毎朝9時、1日1本ずつ、
      **年金以外の題**で出す（残業代・年末調整・住宅ローン控除）。
      公開時刻も本数も 8/5 と同じ。**変えたのは題だけ。**

      しきい値は掛け算して置いた。8/4 の固め出しでの最良が558、後発3本が0。
      8/5 の1本が1245。**題が無関係なら3本とも4桁前後に出るはず**なので、
      300未満が3本続けば「題の効果だった」と言える。
      300は 8/4 の最良558の半分強で、ばらつきを見込んでも下回りにくい線。

      **1本目の途中経過（2026-08-06 15:15）: 残業代が6時間で383回。**
      24時間を待たずに反証条件（300未満）を上回った。**年金以外の題でも配信される。**
      ただし量では年金が強い（年金は12時間で1245、残業代は6時間で383）。
      **「配信されるかどうか」は題によらない。「どれだけ伸びるか」は題で変わる**
      というのが、いまのところ一番素直な読み。残り2本で確かめる。

  - claim: "ショート冒頭の数字は、金額や期間のほうが倍率より効く"
    deadline: "2026-08-12"
    falsified_if: "8/10 の繰上げ（冒頭が0.76倍）が24時間で1000再生を超える"
    next_if_false:
      - "倍率・割合も冒頭に使ってよいことにする（表現の幅が広がる）"
      - "冒頭の数字より、題材そのものが効いていると考える"
    note: >
      **これは推測。** これまで冒頭に出したのは期間（31か月＝1245再生）、
      金額（還付額558・年8万円383）で、**倍率を冒頭に置いた動画はまだ無い。**
      8/10 の繰上げが `0.76倍` で出るので、そこで測れる。

      しきい値は掛け算して置いた。同じ年金題材の繰下げが1245。
      **題材の効果がそのまま出るなら4桁**になるはずなので、
      1000を超えたら「倍率でも効く」と言える。500前後なら
      題材ではなく冒頭の数字が効いている、と読める。

  - claim: "1本あたりの再生数が300〜1500に収まっているのは中身のせいで、天井ではない"
    deadline: "2026-08-15"
    falsified_if: "8/9〜8/15 の7本のうち、24時間で3000再生を超えるものが1本も無い"
    next_if_false:
      - "**この形式では桁が足りない**と確定させる。中身の調整をやめる"
      - "収益をAdSense以外から取る道を試す（1000人の門を通らずに済む）"
      - "同じ計算を、露出の天井が違う面（別プラットフォーム）に出して比べる"
    note: >
      **これがいま一番大事な問いです。** 掛け算するとそうなります。

      実測6本: 311・537・774・1255・1508・438。**5倍のばらつきはあるが、
      どれも4桁の前半で止まっている。** 1日あたり約800再生。

      収益化の門は2つあり、どちらも遠い:
        - 登録者1000人 … 実測の登録率 1/4823 = **0.021%**。
          この率なら**480万再生**、1日800再生で**16年**。
          仮に0.1%まで上げても**3.4年**。
        - ショート単独の門（90日で1000万再生）… いまは90日で**7.2万再生**。
          **139倍足りない。**

      **つまり律速は登録率ではなく、1本あたりの再生数そのもの。**
      ここが100倍にならない限り、他を何倍にしても届きません。

      だから問いを「どう当てるか」から「**そもそも当たる余地があるのか**」に
      変えます。3000は実測の最良1508の約2倍。**中身の差で説明できる幅**
      （すでに5倍のばらつきがある）なので、7本中1本も超えないなら
      それは中身ではなく**天井**と読むのが素直です。

      しきい値は掛け算して置きました。7本×24時間、当たり率が仮に1/7でも
      1本は出る勘定。0本なら「たまたま」では説明しにくい。

  - claim: "尺を30秒に縮めると engaged 比率（すぐスワイプされなかった再生の割合）が上がる"
    deadline: "2026-08-19"
    falsified_if: "30秒設計で作った3本の engaged 比率の中央値が、既存5本の中央値34.8%を上回らない"
    next_if_false:
      - "尺ではなく冒頭の作り（1画面1情報・1〜2秒ごとの視覚変化）を疑う"
      - "静止画スライド＋合成音声という形式そのものを疑う（M5 か M2 へ）"
    note: >
      **engaged 比率が配信の駆動輪だと 2026-08-09 に分かった。**
      平均視聴率は再生数と逆相関する（配信が広がるほど狙いから外れた視聴者に
      当たる）が、engaged 比率は同じ向きに動く。

          年金繰下げ  1263再生  44.2%
          残業代       784再生  35.8%
          年末調整    1506再生  34.8%
          控除の還付額 548再生  17.3%
          家族手当     313再生  11.8%     中央値 34.8%

      競合調査（ChatGPT・M6）でも「25〜35秒に圧縮」「1画面1情報」を勧められた。
      50秒 → 30秒（合計200文字）に変えた。

      **しきい値は掛け算して置いた。** 既存の幅が 11.8〜44.2% と広いので、
      1本では判定できない。3本の中央値で見る。
      既存の中央値34.8%を上回らなければ、尺は効いていない。
      **上回っても「尺のおかげ」とは限らない**（同時に2枚目の前提も外している）。
      **1つずつ変えるべきだったが、両方まとめて変えてしまった。**
      分離が要るなら、次は片方だけ戻して測ること。

      **予想を先に書いておく（2026-08-09、データが出る前）。外れる、と読む。**

      維持率の曲線は、実測した3本とも **4.7〜5.7秒で最も急に落ちる**。
      いっぽう1枚目の尺は、既存4本の文字数を実測の 5.2字/秒 で割ると

          s-zangyo-1  0.0〜 9.0秒（47字）    s-nenkin-1  0.0〜13.1秒（68字）
          s-kojo-1    0.0〜 7.9秒（41字）    s-jutaku-1  0.0〜13.8秒（72字）

      **どれも1枚目の途中で落ちている。** 画面の切り替わりではない。
      そして50秒を30秒に縮めても、**1枚目は1文字も変わらない。**
      engaged が5秒前後で決まるなら、**尾を切っても定義上動きようがない。**

      それでも実験は残す。**動かないこと自体が答えになる**からです。
      3本の中央値が34.8%を超えなければ、結論は「尺を縮めるのが下手だった」
      ではなく **「9秒より後ろは engaged に無関係。全部1枚目で決まっている」**。
      その場合、次に触るのは尺でも2枚目でもなく**冒頭6秒だけ**になります。

      **だから3本は、1枚目を既存と同じ作りのまま尾だけ削ること。**
      冒頭も一緒に変えると、この切り分けが消えます。

