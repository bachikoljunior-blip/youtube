      ついでに分かったこと: **「コメント0」は正確だった。**
      4,400再生に対して視聴者からのコメントは本当に1件も無い
      （1件はすべて自分のもの）。

      **一度この見通しを下方修正しかけたが、根拠が誤りだった（2026-08-09 夜）。**
      `estimatedMinutesWatched ÷ 再生数` で「1再生8.5秒」と出し、
