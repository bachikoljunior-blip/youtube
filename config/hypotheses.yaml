      2026-08-26 から在りましたが、**入力（`imp_ctr_long`）が一度も入らず、
      一度も印字されていませんでした。**（同じ回に直した）

      直したあとの同じ行:

          面（控えから）  876.9回/日   ＝ 279.0回/本 × 長尺 3.14本/日
          合格点          178.0回/日
          実測の CTR        1.44%      → 長尺の再生 12.6回/日 ＝ **14.1倍 足りない**
          要る CTR         20.3%

      **CTR 20.3% は、この機械が測った値のどこにもありません**
      （長尺 1.44% ／ ショート 1.68%。`data/reach.jsonl`）。
      そこで「面を厚くすれば届くのか」を、**枠の上限**で解き直したのがこの前提です ——
      1日に置ける長尺は `batch_build._long_ring()` の **5本**
      （`day_cap.long_form()`: most=7・alive=5・崩れを観測済み）。
      **枠を全部 使い切っても 12.8% 要る。**

      **なぜこれが台帳に無いといけないか。** `eta.py` は
      「**軌跡の腕が動くのは前提を1件閉じたときだけ**」と毎回 印字し、
      同じ回に「**どの帯でも届きません。いまの構成は、上限そのものが目標の下にあります**」
      「届かせるには**ニッチ・尺・形式そのもの**を的にした前提（腕 `rpm`）が要ります」
      とも印字しています。**それでいて開いている 35件 の内訳は
      per_video 15 ／ density 7 ／ sub_rate 6 ／ none 4 ／ rpm 3** で、
      rpm の3件は**どれも長尺の面（インプレッション）の話**です ——
      **形そのものを的にした前提は、1件もありませんでした。**
      `per_video` が実際に出した最大の伸びは **×1.85**（閉じた10件・うち7件は ×1.00）、
      いちばん近い帯に要るのは **×17.8**。**桁がちがう腕に 15/35 を張っています。**

      **この1件は「長尺で門2a を開ける道が在るか」を、算数で閉じます。**
      外れなければ、次に測るのは **門2b（ショート90日 1,000万回）**のほう ——
      実測 64,403回/23日 ＝ 2,800回/日 → 90日で 252,000回 で、**40倍 足りません。**
      **どちらも遠いと分かること自体が、段2 に置いている回転を動かす根拠になります。**

      **n を隠さないこと**: CTR は長尺 16本・インプレッション 2,232回・クリック 49回
      （直近7日）。`per_publish` は 8本の公開から。**枠の 5本 は 08/21 の1日だけの実測**です。

