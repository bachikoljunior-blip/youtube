      **実験どうしがぶつかることを、置く前に確かめること。**

      **n=1 では決まらない。** 3本そろって初めて中央値で言える（`docs/MEANS.md` の
      外れ条件はそちら）。この1本は**向きの当たりを取るためのもの。**

