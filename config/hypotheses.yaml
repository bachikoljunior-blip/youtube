          8/12 の合計 **3104**

      条件の300に対して2本目が1327。**4.4倍で通過。**
      併せ見る指定だった1本目も1777で、**2本目を出したせいで1本目が削られた形跡が
      ありません**（むしろ1本目はチャンネル最高）。1本出しの日は
      8/13が395・8/14が1447・8/11が821なので、**3104は明らかに外側です。**

      **共食いしない。足し算になる。**

      ## 割り引くところ（先に書く）

      **`aUYYSN4pLMw` に24時間ちょうどの観測点がありません。**
      `data/views.jsonl` は 0.5h で0、次が 58.7h で1327 と飛んでいます。
      だから厳密には「24時間で300を超えた」を直接は見ていません。

      それでも通過と読むのは、**このチャンネルのショートが例外なく24時間以内に
