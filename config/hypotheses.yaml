          8/04 控除の還付額  52秒の動画で平均36秒（69%）
          8/04 家族手当      55秒の動画で平均56秒（102%＝繰り返し見られている）
          8/05 年金繰下げ    55秒の動画で平均28秒（51%）
          8/06 残業代        47秒の動画で平均13秒（28%）
          8/07 年末調整      52秒の動画で平均16秒（31%）

      **ばらつきが大きい（28〜102%）。** 平均43%なので、30秒の動画なら
      末尾までの到達は珍しくない。**当初のしきい値（2000再生で2件）のままでよい。**

      **教訓を残す。** 直接その問いに答える指標（`averageViewDuration`）があるのに、
      別の指標を割って自分で数字を作った。**2.6倍ずれた。**
      `estimatedMinutesWatched` は総視聴時間そのものではない。

      **8/19 の尺の実験とは指標が別。** あちらは engaged 比率で、
      engaged は冒頭5秒で決まる（同ファイルの 8/19 の項）。
      最後の1枚を変えても engaged には触れないので、両方を同時に走らせてよい。
      **どちらか一方でも冒頭を変えたら、その時点で両方とも読めなくなる。**

      **ただし、こちら向きには交絡がある（2026-08-09 に気づいた。判定前に書いておく）。**
      8/16・8/17・8/18 の3本は、**尺と末尾を同時に変えている**（50秒→30秒、
