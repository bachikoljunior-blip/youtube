      中央値が、同じ期間の 9時 の本の中央値の ×1.5 を超えるか、÷1.5 を下回るなら
      外れ**（＝ 公開時刻は効く）。**どちらの向きでも外れです** ——
      上へ外れれば「9時 より良い時刻がある」、下へ外れれば「9時 が特別」で、
      **どちらも per_video の腕が公開時刻で動く**という同じ結論になります。

      **判定は `python -m src.publish_hour` の `by_hour()` から。API 0単位。**
      比べるのは**同じ期間の 9時**（08月の 12本ではありません）——
      1本あたり再生は8月後半に大きく動いており、期間をまたぐと時期の効果と
      混ざります（`src/rule_per_video` の「時期と共線」）。

      **6本 に満たなければ判定せず、期限だけ延ばすこと。** ただし
      **`src/house_rule.window_unreachable()` に出たら、そこで打ち切って
      `mixed` で閉じること** —— 1日1本 では 2日に1点しか増えないので、
      門を上げると永久に閉じない側へ倒れます。

      **しきい値 ×1.5 の根拠（掛け算してから置きました）。** 9時 の 12本 は
      中央値 940回・四分位で 400〜1,300回 ＝ 対数で SD ≈ 0.4。
      ×1.5（対数 0.405）を n=6 対 n=6 で両側 5% で検出する力は約 55%、
      ×2.0 なら約 85%。**つまりこの判定は「×2 の差なら見える／×1.5 は
      半々」です。** ×1.2 の差は見えません —— それは承知の上で置いています。
      **効き目の側でしきい値を置く規則**（この repo の他の前提と同じ）:
      per_video の天井を ×24.31 上げる必要がある中で、×1.2 は買えません。
    next_if_false: >
      **外れ（＝ 時刻は効く）なら**、掃く側を「全部の未試行時刻」から
      **上位2〜3時刻だけ**に絞って 2周目を回すこと（1日1本 では 1日1点しか
      増えないので、候補を絞るほど早く決まります）。そのうえで
      `config/channel.yaml` の `publish_hour_jst` と
      `src/publish_hour.best_hour()` をその時刻へ移す。

      **当たり（＝ 時刻は効かない）なら**、`sweep_hour()` の交互をやめて
      9時 に固定し、**配信の側で残る変数は 形式 と 面 の2つだけ**になる。
      そのときは `docs/trigger_main.md` §4 の `improve` の「配信の側」から
      公開時刻の行を落とし、面（サムネのインプレッション）へ寄せること。
    note: >
      **per_video への鎖**（この前提が動かすもの）:

        公開時刻（`config/channel.yaml` の `publish_hour_jst`）
          → その本の生涯再生（`src/publish_hour.by_hour()`）
          → **`per_video`**（`src/rule_per_video.estimate()` の `at_rule`。
             いま 942回 で、**ほぼ 9時 の 12本**で出来ています）
          → `scripts/eta.py` の 月間再生 ＝ per_video × 1本/日 × 30
          → 収益 ＝ 月間再生 ÷ 1000 × RPM

      **なぜ立てたか（2026-09-01・最適化の回）。** `eta.py` は毎周
      「引ける腕は `per_video` だけ」と印字し、同じ画面が
      「**配信の側は中身の側の 10.3倍 当たる**」（27% 対 8%）と印字しています。
      ところが `docs/trigger_main.md` §4 の `improve` の5つの道は
      **全部 中身の側**でした。規則1 が本数を固定した以上、配信の側で残る
      変数は **形式・公開時刻・面** の3つで、**公開時刻は一度も測られていません。**

      実測（この回に数えた・規則の密度の日だけ・17本/14日）:

        8時 n=1 中央値 1,510 ／ **9時 n=12 中央値 940** ／ 18時 n=2 444 ／ 21時 n=2 873
        **残る 20時刻 は 0本**

      そして機械の既定は **19時**（根拠は立ち上げ時の推測「日本の視聴ピークは
      19-22時」だけ・観測 0本）でした。**模型は 9時 の本で解き、機械は 19時 に
      置いていた** —— この repo でいちばん多い壊れ方です。この回に既定を
      9時 へ揃え、掃く仕掛け（`sweep_hour`）を足しました。

      **交絡に注意。** 全密度で時刻ごとに並べると 15〜22時 が中央値 1〜8回 に
      見えますが、**それは時刻の効果ではありません** —— その帯の本は全部
      「その日 13〜21本 出した日」の後ろのほうの本で、`src/day_cap.py` が
      `view_cap` で説明ずみです。**規則の密度に絞ると 18時 444回・21時 873回。**
      判定はかならず `rule_band()` を通した本で行うこと。

