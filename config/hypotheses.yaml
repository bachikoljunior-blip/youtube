# 検証していない前提と、その反証の期限。
#
# なぜ要るか。**推測は、期限を切らないと永久に推測のまま残る。**
# これまで「効くはず」で進めた判断がいくつもあり、どれも検証されていない。
# JOURNAL に書くだけでは読み飛ばされるので、scripts/status.py が毎回出す。
#
# 期限を過ぎたものは status.py が目立つ形で出す。そこで必ず判定すること。
# 「まだ分からない」で延ばすなら、延ばす理由と新しい期限を書き直すこと。
#
# **しきい値は必ず掛け算してから置くこと。** 一度、登録率の検証しきい値を
# 「100再生」と勘で置いた。登録率0.3%なら100再生の期待値は0.3人で、
# 0人でも何も否定できない。**検出できない条件を反証条件にしてはいけない。**
#
#   claim        いま前提にしていること
#   deadline     判定する日（JST）
#   falsified_if これが起きていたら外れ、とみなす条件。**数字で書くこと**
#   next_if_false 外れていたら次に試すこと。順番に

hypotheses:
  - claim: "ショートを固めて出すと、後から出したものに露出が回らない"
    deadline: "2026-08-05"
    falsified_if: "8/4 の19:07以降に出した3本が、翌朝までに合計100再生を超える"
    next_if_false:
      - "固め出しは問題ないので、1日の本数を増やす方向で試す"
    note: >
      8/4 は5本を90分に固めて出した。18:29→256回、18:32→100回に対し、
      19:07・19:39・19:55 は2時間たっても0回。単に配信が遅れているだけの
      可能性が高い（**これは推測**）が、固め出しで絞られた可能性も残る。
      どちらかで「1日に何本出すか」が変わるので、切り分ける価値がある。

  - claim: "ショートの最後に「次に何の数字が得られるか」を言うと登録につながる"
    deadline: "2026-08-09"
    falsified_if: "ショートが計3000再生を超えても登録者が0のまま"
    next_if_false:
      - "長尺への誘導を1本試す（ショート単体で登録させるのをやめる）"
      - "チャンネル概要と再生リストを、ショートから来た人向けに書き直す"
    note: >
      **しきい値を100→3000に直した（2026-08-04）。** 登録率0.3%なら
      100再生の期待値は0.3人で、0人でも何も否定できない。検出できない条件を
      反証条件にしていた。3000再生なら期待9人なので、0人ならさすがに否定できる。

  - claim: "計算で独自性を出す構成なら、量産テンプレート判定を避けられる"
    deadline: "2026-09-01"
    falsified_if: "収益化を申請できる段階で、審査に落ちるか警告が出る"
    next_if_false:
      - "実画面の収録を混ぜる（まだ手をつけていない）"
      - "合成音声をやめて自分の声にする"

# 確認できたもの。**消さないこと。** 同じ問いを二度立てないための記録。
confirmed:
  - claim: "認知ゼロのチャンネルでも、ショートにはフィードから露出が出る"
    confirmed_on: "2026-08-04"
    evidence: >
      登録者0のまま、公開2時間半で NzygRNpx8GU が256回、EanVD0YZPlo が100回。
      同じ日に出した長尺は1回。**ショートと長尺で2桁以上の差がある。**
      流入経路APIは当日ぶんを返さないので SHORTS の明示はまだ取れていないが、
      登録者0のチャンネルで256回はフィード以外に説明がつかない。
    implication: >
      律速は登録者で、露出が出る面はショートだけだと確認できた。
      **資源はショートに寄せる。** 長尺は総再生時間を積む役として残すが、
      本数を増やす先はショート。
