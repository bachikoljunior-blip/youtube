    note: >
      **なぜ `rpm` か**（2026-08-26 に、YAML のコメントから本文へ移しました）。
      M3 ＝ AdSense を通さない収益で、**1再生あたりの実入りそのものを替えます** ——
      転換 5% × ¥2,000 なら、1再生の値段が広告の RPM とは別の桁に乗ります。
