    deadline: "2026-08-14"
    falsified_if: "8/12 21:00 の追加ぶん aUYYSN4pLMw が24時間で300再生に届かない（同じ日 09:00 の gPusj-Y2404 が300以上あるとき）"
    closed_on: "2026-08-15"
    outcome: survived
    lever: density
    side: dist
    effect: 1.75
    effect_note: "2本出した日の合計3,104回。2本目1,327 ÷ 1本目1,777 ＝ 0.75 ＝ 密度2倍で1日の再生1.75倍"
    verdict: >
      **反証条件は満たさなかった（2026-08-15 に判定。期限を1日超過している）。**
      **配信の上限は動画単位です。チャンネル単位ではありません。**

          gPusj-Y2404  8/12 09:00（1本目）  **1777**  ← チャンネルの最高値
          aUYYSN4pLMw  8/12 21:00（2本目）  **1327**
          8/12 の合計 **3104**

      条件の300に対して2本目が1327。**4.4倍で通過。**
      併せ見る指定だった1本目も1777で、**2本目を出したせいで1本目が削られた形跡が
      ありません**（むしろ1本目はチャンネル最高）。1本出しの日は
      8/13が395・8/14が1447・8/11が821なので、**3104は明らかに外側です。**

      **共食いしない。足し算になる。**

      ## 割り引くところ（先に書く）

      **`aUYYSN4pLMw` に24時間ちょうどの観測点がありません。**
      `data/views.jsonl` は 0.5h で0、次が 58.7h で1327 と飛んでいます。
      だから厳密には「24時間で300を超えた」を直接は見ていません。

      それでも通過と読むのは、**このチャンネルのショートが例外なく24時間以内に
      頭打ちになる**ためです（`gPusj-Y2404` は12.5hで1338、`pMHDwK5tB2E` は
      22.7hで1447、確定済み仮説「ショートには長い尾が無い。48時間で完全に止まる」）。
      58.7時間の1327のうち300未満しか24時間以内に入っていない、という形は
      **この計器で観測した挙動と両立しません。**

      **とはいえ、これは推論です。** 次に同じ形を測るときは、
      **公開12〜24時間後に必ず1点取ること**（今回は取り漏らしました）。

      ## n について

      **n=1 のままです。** `docs/MEANS.md` の M9 は「3本そろって中央値で言う」と
      書いてあり、そちらの外れ条件はまだ満たしていません。
      **今日決まったのは向きだけ**で、「1日2本が常に成立する」ではありません。

      ## これで動かすもの

      **B10「ショートは1日1本に絞る」の根拠が消えました**（`docs/CONSTRAINTS.md`）。
      B10 の根拠は 8/4 に90分間隔で5本出して後の3本が0回だったこと、
      覆る条件は「この仮説の判定次第」と書いてありました。**判定が出たので外します。**
      **効いていたのは本数ではなく間隔だった**、と読み替えます。

      ただし**「だから増やせば届く」ではありません。** 同じ日に確定した
      「1本あたりの再生は天井」と掛けると、1日2本でも門まで**2.1年**です
      （そちらの verdict に計算があります）。**本数は使える。でも足りない。**
    next_if_false:
      - "本数を増やす作業を全部やめる。資源を1本あたりの質（engaged）と変換（M8）に全振り"
      - "間隔を24時間より広げる方向は試さない（1日1本が上限という結論になるだけ）"
    note: >
      **M9 の1本目**（`docs/MEANS.md`）。問いは
      **「配信の上限はチャンネル単位か、動画単位か」。**

          動画単位なら      1日2本 → 1日1320再生
          チャンネル単位なら 何本出しても 1日660再生

      **2倍になっても登録者の門は救われない**（483万再生が20年から10年になるだけ）。
      **やる理由は、結果が作業カテゴリ1つを殺すか生かすから。**
      チャンネル単位だと分かれば、**本数を増やす作業は全部むだ**と確定する。
      いまはどちらか分からないまま両方に少しずつ賭けていて、一番損な状態。

      **既知の実測は1件だけ。** 8/4 に90分間隔で5本出したら後の3本が0回。
      確定済み仮説の本文自体が「n=1日なので、1日1本の場合を次に確かめる」で
      終わっている。**12時間あけた場合は一度も試していない。**

      しきい値は実測から置いた。公開済みショートの24時間再生は **311〜1509、
