  - claim: "1本あたりの再生数が300〜1500に収まっているのは中身のせいで、天井ではない"
    deadline: "2026-08-15"
    falsified_if: "8/9〜8/15 の7本のうち、24時間で3000再生を超えるものが1本も無い"
    next_if_false:
      - "**この形式では桁が足りない**と確定させる。中身の調整をやめる"
      - "収益をAdSense以外から取る道を試す（1000人の門を通らずに済む）"
      - "同じ計算を、露出の天井が違う面（別プラットフォーム）に出して比べる"
    note: >
      **これがいま一番大事な問いです。** 掛け算するとそうなります。

      実測6本: 311・537・774・1255・1508・438。**5倍のばらつきはあるが、
      どれも4桁の前半で止まっている。** 1日あたり約800再生。

      収益化の門は2つあり、どちらも遠い:
        - 登録者1000人 … 実測の登録率 1/4823 = **0.021%**。
          この率なら**480万再生**、1日800再生で**16年**。
          仮に0.1%まで上げても**3.4年**。
        - ショート単独の門（90日で1000万再生）… いまは90日で**7.2万再生**。
          **139倍足りない。**

      **つまり律速は登録率ではなく、1本あたりの再生数そのもの。**
      ここが100倍にならない限り、他を何倍にしても届きません。

      だから問いを「どう当てるか」から「**そもそも当たる余地があるのか**」に
      変えます。3000は実測の最良1508の約2倍。**中身の差で説明できる幅**
      （すでに5倍のばらつきがある）なので、7本中1本も超えないなら
      それは中身ではなく**天井**と読むのが素直です。

      しきい値は掛け算して置きました。7本×24時間、当たり率が仮に1/7でも
      1本は出る勘定。0本なら「たまたま」では説明しにくい。

  - claim: "尺を30秒に縮めると engaged 比率（すぐスワイプされなかった再生の割合）が上がる"
    deadline: "2026-08-19"
    falsified_if: "30秒設計で作った3本の engaged 比率の中央値が、既存5本の中央値34.8%を上回らない"
    next_if_false:
      - "尺ではなく冒頭の作り（1画面1情報・1〜2秒ごとの視覚変化）を疑う"
      - "静止画スライド＋合成音声という形式そのものを疑う（M5 か M2 へ）"
    note: >
      **engaged 比率が配信の駆動輪だと 2026-08-09 に分かった。**
      平均視聴率は再生数と逆相関する（配信が広がるほど狙いから外れた視聴者に
      当たる）が、engaged 比率は同じ向きに動く。

          年金繰下げ  1263再生  44.2%
          残業代       784再生  35.8%
          年末調整    1506再生  34.8%
          控除の還付額 548再生  17.3%
          家族手当     313再生  11.8%     中央値 34.8%

      競合調査（ChatGPT・M6）でも「25〜35秒に圧縮」「1画面1情報」を勧められた。
      50秒 → 30秒（合計200文字）に変えた。

      **しきい値は掛け算して置いた。** 既存の幅が 11.8〜44.2% と広いので、
      1本では判定できない。3本の中央値で見る。
      既存の中央値34.8%を上回らなければ、尺は効いていない。
      **上回っても「尺のおかげ」とは限らない**（同時に2枚目の前提も外している）。
      **1つずつ変えるべきだったが、両方まとめて変えてしまった。**
      分離が要るなら、次は片方だけ戻して測ること。

      **予想を先に書いておく（2026-08-09、データが出る前）。外れる、と読む。**

      維持率の曲線は、実測した3本とも **4.7〜5.7秒で最も急に落ちる**。
      いっぽう1枚目の尺は、既存4本の文字数を実測の 5.2字/秒 で割ると

          s-zangyo-1  0.0〜 9.0秒（47字）    s-nenkin-1  0.0〜13.1秒（68字）
          s-kojo-1    0.0〜 7.9秒（41字）    s-jutaku-1  0.0〜13.8秒（72字）

      **どれも1枚目の途中で落ちている。** 画面の切り替わりではない。
      そして50秒を30秒に縮めても、**1枚目は1文字も変わらない。**
      engaged が5秒前後で決まるなら、**尾を切っても定義上動きようがない。**

      それでも実験は残す。**動かないこと自体が答えになる**からです。
      3本の中央値が34.8%を超えなければ、結論は「尺を縮めるのが下手だった」
      ではなく **「9秒より後ろは engaged に無関係。全部1枚目で決まっている」**。
      その場合、次に触るのは尺でも2枚目でもなく**冒頭6秒だけ**になります。

      **だから3本は、1枚目を既存と同じ作りのまま尾だけ削ること。**
      冒頭も一緒に変えると、この切り分けが消えます。

  - claim: "ショートの最後を「答えやすい問いかけ」で終えると、共有とコメントが付く"
    deadline: "2026-08-22"
    falsified_if: "問いかけ型にした後のショートが計2000再生に達した時点で、コメントが2件未満"
    next_if_false:
      - "最後の1枚そのものを捨てて、そのぶん尺を縮める（どの型でも取れないなら枠ごと無駄）"
      - "コメントではなく共有を狙う型に変える（保存したくなる一覧を最後に置く）"
    note: >
      **この枠で2つ続けて外している。** 「次に何の数字が得られるか」の予告が
      856人で登録0人。「この場所の性格を言う」が2720再生で登録0人（8/8 確定）。
      **測って分かっているのは「ここで登録は取れない」**ということなので、
      3つ目の登録誘導を試すのではなく、**取りにいく対象を変えた。**

      8/9 の実測で **4,383再生に対して共有1・コメント0。**
      共有もコメントも配信に効く信号なのに、**動画が視聴者に何も問いかけていない。**

      **しきい値は掛け算して置いた。** いまのコメント率は 0/4,383 で、
      共有率は 1/4,383 = 0.023%。3本で2000再生なら、**いまのままの率では
      期待コメント数がほぼ0**なので、「0件」を反証条件にすると
      **何が起きても否定できない**（登録率で一度やった間違い）。
      問いかけが効く場合の目安を0.2%と置くと2000再生で期待4件。
      **2件未満なら、効いていないと言える。**

      **8/19 の尺の実験とは指標が別。** あちらは engaged 比率で、
      engaged は冒頭5秒で決まる（同ファイルの 8/19 の項）。
      最後の1枚を変えても engaged には触れないので、両方を同時に走らせてよい。
      **どちらか一方でも冒頭を変えたら、その時点で両方とも読めなくなる。**

      **ただし、こちら向きには交絡がある（2026-08-09 に気づいた。判定前に書いておく）。**
      8/16・8/17・8/18 の3本は、**尺と末尾を同時に変えている**（50秒→30秒、
      チャンネル説明→問いかけ）。engaged は冒頭で決まるので 8/19 には影響しないが、
      **コメントは違う。短いほうが最後まで見られる人が増え、問いかけに到達する人も増える。**
      つまりコメントが付いた場合、**問いかけの効果か、到達率が上がった効果かを
      分けられない。**

      **分けなくてよい、と判断した。** どちらでも「最後の1枚は取りにいける」ことになり、
      次の一手（末尾の枠を使い続ける）は同じだから。
      **付かなかった場合は、到達率が上がってなお0**ということなので、
      「この枠では取れない」がより強く言える。**判定は保守側に倒れる。**

  - claim: "長尺の登録率はショートより1桁以上高い（律速の登録者は長尺でしか動かない）"
    deadline: "2026-09-15"
    falsified_if: "検索狙いの長尺が計1000再生に達した時点で、そこからの登録が2人未満"
    next_if_false:
      - "**M1（AdSense）は形式を変えても届かないと確定させる。** 登録者の門を通る道が無い"
      - "M3（AdSense を通さない収益）に移る。オーナーへの依頼が要るが、他に道が無い"
      - "**依頼が読まれない前提**なので、依頼と並行して「1,000人を通らない収益」を自分で作る"
    note: >
      **これがいま一番大事な数字です。** 掛け算するとそうなります。

      実測（直近90日、2026-08-09）:

          ショート(3分以下)  6本  4,415再生  登録1人  **0.0227%**
          長尺(3分超)        1本      1再生  登録0人  **未測定**

      **ショートの率では、1,000人に 440万再生。** 1日800再生なら**15年**。
      **形式を変えない限り、この門は通りません。**

      長尺の登録率は**一度も測れていない。** 既存の長尺7本が0〜1再生で、
      分母が無かったためです（推測で題材を選んでいたのが原因。`docs/SEARCH_TERMS.md`）。
      検索狙いに変えた長尺が 8/9・8/10 に公開されるので、ここで初めて分母ができる。

      **しきい値は掛け算して置いた。** 一般に言われる長尺の登録率0.5%なら
      1,000再生で期待5人。ショートの率(0.0227%)なら期待0.23人。
      **2人未満なら「1桁高い」は否定できる。**
      0人か否かでは分けられない（ショートの率でも0人が普通なので）。

      **もう一つの結末も答えです。** 9/15 までに**1,000再生に届かなかった場合**、
      それは登録率の話ではなく **M4（検索流入）そのものが立ち上がらなかった**
      ということ。そのときは M4 を外れとして扱い、同じく M3 へ移る。
      **どちらに転んでも次の一手が決まる**ように条件を2つ書いてあります。

  - claim: "既存の長尺が0再生なのはタイトルのせいで、中身のせいではない"
    deadline: "2026-08-20"
    falsified_if: "題を書き換えた5本の合計が、8/20 時点で20再生に届かない"
    next_if_false:
      - "**タイトルだけでは検索に載らないと確定させる。** 中身か、チャンネルの権威のほう"
      - "長尺は新規（検索語から題材を選んだもの）だけで測る。過去分の再利用をやめる"
      - "それでも 9/15 の登録率の判定は新規3本で続ける（母数が別）"
    note: >
      **在庫がただで置いてある。** 公開済みの長尺5本（9〜11分）が
      **合計1再生**のまま5日たっている。中身は `src/calc/` の計算で、
      前提も条文も説明欄に入っている。**題だけが「結論の言い切り」で、
      誰も打たない語だった。**

          旧: ふるさと納税 目安表どおりで最大8623円損する条件
          新: ふるさと納税 上限 社会保険料率で変わる 年収600万で3008円の超過

      2026-08-09、5本とも**検索で打たれる語を先頭に置く題**に書き換えた。
      中身・説明欄・タグは1文字も変えていない。**変えたのは題だけ。**

      **これは対照のある実験です。** 同じ動画の、同じ期間の前後で比べられる。
      新規3本（8/9・8/10・8/11 公開）とは母数を分けること。
      あちらは題材から検索語で選んでいるので、条件が違う。

      **しきい値は掛け算して置いた。** いまの実績は5本で**5日1再生**。
      題が効くなら、薄い語なので大きくは伸びなくとも0のままにはならない。
      11日で20再生は1本あたり4再生で、**1再生からの20倍**。
      これに届かないなら「題だけでは載らない」と言ってよい。
      **0か否かにしない**（1再生でも通ってしまうので）。

      **ついでに直ったこと**: 旧題の「最大163万円」「年21万円」は
      **丸めた数字**で、いまの `_check_title_from_calc` なら落ちる。
      正確な 163万9800円・21万4千円 に直した。
      **検査を作る前に出したものは、検査を通っていない。**

  - claim: "engaged を決めているのは尺でも文言でもなく、冒頭で画面が変わらないこと"
    deadline: "2026-08-26"
    falsified_if: "新しい冒頭で作った3本（8/19〜8/21）の engaged 比率の中央値が、8/16〜8/18 の3本の中央値を上回らない"
    next_if_false:
