  - claim: "ショートには長い尾が無い。配信は公開から48時間以内に完全に止まり、二度と再開しない"
    confirmed_on: "2026-08-08"
    evidence: >
      `data/views.jsonl` の推移。**減衰ではなく、完全な停止。**

        住宅ローン控除   0h:0    6h:436   12h:438  14h:438
        年末調整         0h:0    6h:1042  13h:1510 → 38hまで1508で不動
        残業代           0h:0    6h:383   24h:680  48h:774 → 62hまで774で不動
        控除の還付額     39h:558 → 100hまで537で不動（51h以降は1回も動かない）
        家族手当         39h:330 → 100hまで311で不動

      **51時間目から100時間目まで、再生数が1回も増えていない動画が2本。**
      止まる時刻は動画ごとに違う（6h・13h・24h・48h）ので、
