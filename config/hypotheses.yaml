# 検証していない前提と、その反証の期限。
#
# なぜ要るか。**推測は、期限を切らないと永久に推測のまま残る。**
# これまで「効くはず」で進めた判断がいくつもあり、どれも検証されていない。
# JOURNAL に書くだけでは読み飛ばされるので、scripts/status.py が毎回出す。
#
# 期限を過ぎたものは status.py が目立つ形で出す。そこで必ず判定すること。
# 「まだ分からない」で延ばすなら、延ばす理由と新しい期限を書き直すこと。
#
# **しきい値は必ず掛け算してから置くこと。** 一度、登録率の検証しきい値を
# 「100再生」と勘で置いた。登録率0.3%なら100再生の期待値は0.3人で、
# 0人でも何も否定できない。**検出できない条件を反証条件にしてはいけない。**
#
#   claim        いま前提にしていること
#   deadline     判定する日（JST）
#   lever        この前提が動かす腕。**立てるときに書くこと**（下の節）
#   side         この実験のために**何をいじるか**。`dist` / `content` / `infra`
#                （腕とは別の軸。**立てるときに書くこと**。下の節）
#   falsified_if これが起きていたら外れ、とみなす条件。**数字で書くこと**
#   next_if_false 外れていたら次に試すこと。順番に
#   next_done     その手をどうしたか。**`next_if_false` と同じ並び**で1行ずつ
#   effect       閉じたときに書く。**1日の再生が何倍になったか**（`> 1.0` が当たり）

# --- `lever`（2026-08-26・最適化の回に足した）---
#
# **この欄は 8/20 から `src/arm_speed.py` が読んでいましたが、
# 書式のここには一度も書かれていませんでした。** 結果、
# **開いた15件のうち 10件（67%）が空**で、閉じた21件だけが埋まっていました
# ——「閉じるときに書き足す」運用になっていたということです。
#
# **空欄が何を壊すか（どれも黙って起きます）:**
#
#   `arm_speed.closed()`   `lever` か `effect` の無い行を丸ごと飛ばす。
#                          飛ばされた分は **θ（回転の速さ）にも入らない**ので、
#                          `rate = p·log(g)·θ` で**全部の腕の速さが同時に下がる**
#   `arm_speed.planned()`  「これから閉じる前提の配分」が数えられない。
#                          軌跡は `share`（**過去**の配分）で未来を解いているので、
#                          突き合わせる相手が消える（実測 2026-08-26 で **19日** ちがった）
#   `followup.open_on_lever()` 外れた前提の「次の手」が、同じ腕の開いた前提を
#                          名指しできない（＝(1.8) の門が候補を出せない）
#
# **腕は、閉じてから決めるものではありません。** 閉じてから付けると、
# `share` は「過去にどう振ってきたか」の写しにしかならず、
# **どの腕に賭けるかを一度も選んでいないことになります**（`CLAUDE.md` A14
# ——「昔そう決まったから」は理由になりません）。
#
# 選び方は、**`falsified_if` が何を数えているか**で決まります（閉じた21件の前例）:
#
#   engaged 比率 / 1本あたり再生 を数える      → per_video
#   1日に配信・再生が付く本数を数える          → density
#   登録 / subscribersGained ÷ 再生 を数える   → sub_rate
#   露出の面 / AdSense を通さない収益 を数える → rpm
#   腕の倍率をどれも動かさない                 → none（分母から外れます）
#
# **基盤の話（鎖・承認・道具・枠）は `none` です**（2026-08-26 夕に足した）。
# 欄が必須なので**とりあえず近そうな腕を書く**のが、いちばん多い壊れ方でした。
# `none` は逃げではなく、**正しい札**です —— `arm()` の `pool` から外れるので、
# **1件 置き間違えるたびに 4本の腕が同時に遅くなります**（実測: 08/25 の
# 「MCP を許可に入れれば鎖は承認なしで回る」を `density` から `none` へ移すだけで、
# per_video / sub_rate / rpm / density の **4本とも rate が上がり**、到達予測が **1.7日** 動いた）。
#
# **鎖は、その実験が実際に数えている値まで届いていること**（2026-08-26 夕に足した）。
#
# 「測る値は1本あたり再生だが、動かしているのは**ニッチ**だから `rpm`」——
# これは通りません。**ニッチを1度も数えていない**からです。
# 閉じたときに `effect` へ入るのは**数えた値の倍率**で、`arm_speed.arm()` は
# それを**その腕の伸び幅 `g`** としてそのまま使います。だから付け札を間違えると、
# **測っていない腕に、測った倍率が書き込まれます**（09/03 期限の「深い題」で
# 実際に起きていた。`rpm` → `per_video` に直して **7日**）。
#
# **機構の見立てを捨てる必要はありません。別の1件として立てること** ——
# その腕が数える値（上の表）を `falsified_if` に書けば、鎖は届きます。
#
# **鎖は `note` / `falsified_if` / `claim` のどれかに書くこと。
# YAML のコメントに書かないこと**（2026-08-27・最適化の回。**2度目**）。
# `yaml.safe_load()` はコメントを捨てるので、`# 実効RPM ＝ …` と
# `lever:` の行に添えても、**機械からは1文字も見えません。**
# 実際に `tests/test_eta_headline_alloc_hand.py` が赤くなり、
# **枝が赤いまま押されていました**（同じ趣旨は 2026-08-26 に
# 「出したもの3: 鎖をコメントに書かない」として一度 出ていますが、
# **書いた先が JOURNAL と1件の `note` の中だけ**で、
# **次に前提を立てる回が読む所には無かった** —— だからここに置きます）。
#
# **引き代で腕を選ばないこと。** 「`per_video` では天井に届かないから `rpm` に置く」は、
# **どの腕に賭けたいか**の話であって、**この実験が何を測っているか**の話ではありません。
# 2026-08-26 に直した3件は、朝の2件（`rpm`→`density`）も夕の1件（`rpm`→`per_video`）も
# **全部この形**でした。**台帳が「賭けたい所」を指すと、軌跡は嘘の日付を出します。**

# --- `next_done`（2026-08-25・最適化の回に足した）---
#
# **実験を閉じて手に入るのは `next_if_false` の1行だけです。**
# `eta.py` が毎回そう印字しています ——
# 「軌跡の腕が動くのは、前提を1件閉じたときだけ」。16本作って2週間待った代金が、それ。
#
# **その1行を、誰も読み返していませんでした**（2026-08-25 実測：
# 外れ／半々の前提 14件・手 31件・**記録された手 0件**）。
# `status.py` は「開いている前提に次の手が**書かれているか**」は見ますが、
# **書かれた手が実行されたかは、どの機械も見ていませんでした。**
#
# 落ちた実例: **5件の外れた前提が、16日かけて同じ方向を指しています** ——
# 08/07「切り口ではなく**形式**を疑う」／08/08「やめた。**桁が足りない**」／
# 08/15「この形式では桁が足りない。**中身の調整をやめる**」／
# 08/20「**静止画スライド＋合成音声という形式そのものを疑う**」／
# 08/23「形式そのものを疑う」「**この機械の改善はここで打ち切る**」。
# それでも 08/19 に中身の調整の実験が2件 新しく開かれ、
# 08/25 時点で engaged を上げにいく開いた前提が **5件** 残っています。
#
# 書き方（**日付と、採用／却下のどちらかが要ります**）:
#
#   next_if_false:
#     - 静止画スライド＋合成音声という形式そのものを疑う
#     - M5（RPM の高いニッチ）へ
#   next_done:
#     - "2026-08-26 採用: 実画面の収録で1本作った（…）"
#     - "2026-08-26 却下: RPM の帯を測っていないので、先に…"
#
# **「見た」「確認」では消えません** —— 消せる形にしたら、この欄は最初から要りません。
# **却下は正しい答えになり得ます**（データが薄い・別の手が速い）。
# 書かれていないことだけが問題です。書かれていなければ、次に来た側は
# 「その手は試したのか」を知る方法がありません。
#
# 見る道具: `python scripts/verdict_followup.py`（`stop_check.sh` が `--gate` で呼ぶ）

# --- 閉じた前提に足す4つの欄（2026-08-20 18:xx。**軌跡の予測に使います**）---
#
# オーナー指示（原文）——
#
#   > 腕とやらをそう設定した時に達成がいつになるって予測じゃなくて、じゃあその腕を
#   > そうなるまでにどれくらい時間がかかるのかとか予測しないとダメだよ。特定条件の
#   > 予測じゃなくて、実際にどういう軌跡を辿るか予測して、いつ達成かを予測するんだよ。
#
# `scripts/eta.py` は「腕を2倍にしたら◯月◯日」を出していましたが、
# **2倍になるのに何日かかるかを1行も予測していませんでした。** 腕が動く速さは
# 「1回転に何日か × 当たる確率 × 当たったときの伸び幅」で、その3つは**ここにしか
# 残っていません**（`src/arm_speed.py` が読みます）。散文の verdict からは機械が
# 読めないので、閉じた前提には次の欄を必ず足すこと。
#
#   closed_on    実際に判定した日（**deadline ではありません**。前倒しも超過もある）
#   outcome      survived ＝ 反証条件を満たさなかった ／ falsified ＝ 外れ ／ mixed ＝ 半々
#   lever        その前提が動かそうとしていた腕（per_video / sub_rate / rpm / density / none）
#   effect       **実測で「1日の再生」がその腕で何倍になったか。1.0 ＝ 動かなかった**
#   effect_note  その倍率の出どころ（数字をそのまま）
#
# **「当たり」は outcome ではなく `effect > 1.0` で数えます。** 反証条件を満たさなかった
# だけの前提（例: 「固めて出すと後発に露出が回らない」）は、確かに生き残っていますが
# **1日の再生を1倍も増やしていません。** outcome で数えると、そこが当たりに化けます。
#
#   ceiling      その前提が**天井を測ってしまった**ときだけ足す（lever/value/unit/escape）。
#                軌跡は、天井のある腕をそれ以上伸ばしません。
#
# --- `side`（2026-08-29・最適化の回に足した。**その回に測った数です**）---
#
# **腕（`lever`）とは別の軸です。** 腕は「どの倍率を動かすか」、
# 側は「**その実験のために何をいじるか**」。
#
#   dist     **動画の外側**。形式（ショート／長尺）・公開の時刻・1日の本数・
#            間隔・面（インプレッション）・チャンネル単位の配分。
#            **本の中身を1文字も変えずに動かせるもの**が、ここです
#   content  **動画の中身**。題・文言・冒頭の絵・コマの速さ・尺の秒数・
#            説明欄・構成・作る題材とその順番
#   infra    **道具・鎖・枠・収益化の可否**。腕の倍率を直接は動かさない
#            （`lever: none` と重なることが多いが、同じものではありません）
#
# **迷ったら「この実験を回すために、動画ファイルを作り直すか」で切ること。**
# 作り直すなら `content`、予約表や本数だけ変えるなら `dist`。
#
# **なぜ要るか（2026-08-29 に、閉じた20件へ1件ずつ札を付けて数えた）:**
#
#     側          n    当たり   p       伸び幅（中央値）   最大
#     配信の側     8      3    0.38         ×1.85        ×256
#     中身の側    11      1    0.09         ×1.20        ×1.20
#
# `rate = p·log(g)·θ` の `p·log(g)` で並べると **13.9倍** ちがいます。
# 同じ日に**開いていた 27件は 配信14 ／ 中身12 ／ 道具1** ——
# **枠の 44% が、13.9倍 遅いほうに乗っていました。**
# 実験は同じ公開の流れを取り合う（題の A/B と冒頭の絵の A/B を同じ本に
# 重ねると交絡する）ので、**枠は希少**です。だからここは選択です。
#
# **この札で到達日は動きません**（1/11 対 3/8 ＝ フィッシャー p≈0.13・有意ではない）。
# 印字されるだけです。**日付を動かすかどうかの覆る条件は
# `src/arm_speed.sides()` の docstring**にあります。
#
hypotheses:
  - claim: "収益化の審査は、門1・門2a の数字が揃えば通る（＝段3 は待つだけの段）"
    deadline: "2026-09-30"
    lever: none          # **腕ではありません。** 腕を全部 掛ける側の係数なので、ここに腕は無い
    # `side: infra`（道具の側）—— 2026-08-31 に足した（`tests/test_arm_speed_sides.py::
