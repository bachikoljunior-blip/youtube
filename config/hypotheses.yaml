      **反証条件は満たさなかった（2026-08-12 09:40 に前倒しで確定）。
      だが「あたり」と書くのは誤りです。しきい値のほうが古くなっていました。**

      `7NtIDFiPrsw`（年金・繰上げ）は 1191再生で **engaged 46.7%。**
      条件の「36.1% 以下」には当たらない。**条件の字面では生き残ります。**

      **ところが、比較する側が動いていました。** 36.1% は
      「**非年金の最高**」として置いた数字で、**固定値ではなく群の性質です。**
      いま同じ群を引き直すと:

          年金繰上げ    1191再生  engaged 46.7%   ← 年金
          年金繰下げ    1256再生  engaged 44.3%   ← 年金
          失業給付      1012再生  engaged 45.0%   ← **非年金**
          年末調整      1508再生  engaged 34.7%
          残業代の時給   774再生  engaged 36.4%

      **非年金の最高は 36.1% → 45.0% に上がっています**（失業給付 `SsUYduA1dpg`）。
      年金の最高との差は **10.6pt → 1.7pt。** そして年金2本のうち1本（44.3%）は
      **その非年金を下回っています。**

      **つまり「年金だけが取る」は、もう成り立ちません。**
      置いたときの意図（年金は非年金のどれよりも上）で判定すると、これは**外れ寄り**です。
      条件の字面で判定すると生き残ります。**字面のほうを信じないこと** ——
      意図は note に書いてあり、そこには「非年金の最高を超えること」とあります。

      **一般化して置いておく（これが今回の収穫）:**
      **「群のいちばん上」「中央値」のような相対のしきい値を、数字に焼いて置かないこと。**
      群は増えます。焼いた瞬間から、条件は意図とずれていきます。
      相対で置くなら、**判定のときに群を引き直す**と条件文に書くこと。
      `docs/HYPOTHESES.md` 冒頭の「検出できない条件を反証条件にしてはいけない」と
      同じ種類の壊れ方で、**あちらは分母、こちらは比較群です。**

      **登録・共有では相変わらず判定していません**（実測の登録率では検出できない）。
    next_if_false:
      - "題材ではなく、その1本の作り（68字の1枚目・図の形）が効いたと考える"
      - "engaged を題材の指標として使うのをやめ、共有だけで見る"
    note: >
      **8/10 に、動画べつを初めて横に並べて気づいた。**
      チャンネルで起きた「登録1件」「共有1件」が、**同じ1本に集まっている。**

          年金の繰下げ   1254再生  engaged 44.4%  登録1  共有1  リスト0
          年末調整       1512再生  engaged 34.7%  登録0  共有0  リスト1
          残業代の時給    782再生  engaged 36.1%  登録0  共有0  リスト0
          控除の還付額    537再生  engaged 17.3%  登録0  共有0  リスト0
          住宅ローン控除  437再生  engaged 19.0%  登録0  共有0  リスト0
          家族手当        311再生  engaged 11.9%  登録0  共有0  リスト0

      **年金だけが、engaged 最高・登録・共有の3つを同時に取っている。**
      再生数は1位ではない（年末調整のほうが多い）ので、
      **配信量では説明がつかない。**

      **登録では判定しない。** ここが要点で、実測の登録率は 0.021%。
      1000再生あたりの期待値が0.2人なので、**1本の登録が0でも1でも
      何も否定できない**（このファイルの冒頭に書いた「検出できない条件を
      反証条件にしてはいけない」に自分で引っかかる）。
      engaged は数百再生あれば安定する割合なので、**そちらで判定する。**

      しきい値は掛け算して置いた。非年金5本の engaged は 11.9〜36.1%
      （中央値19.0%）。**中央値を上回るだけなら弱い**ので、
      **非年金の最高（36.1%）を超えることを条件にした。**
      年金の繰下げは 44.4% なので、題材の効果ならここは超える。

      **交絡は残る。** 44.4% の1本は1枚目が68字（最長）でもあり、
      8/26 の仮説と真逆を向いている。**どちらが効いているかは、
      この1本では分けられない。** 分けるには、年金題材で1枚目を短くした
      ものが要る（8/19〜8/21 の群がそれに当たるなら、そこで交差する）。

