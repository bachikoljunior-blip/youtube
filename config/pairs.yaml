# ショート → 同じ題材の長尺。**M8（フィードから出口を作る）の対応表。**
#
# なぜ要るか。2026-08-10 に台帳を7件ぜんぶ掛けたら、詰まりが1点に集まった。
#
#     再生の 99.95% がショートのフィード内で完結し、視聴ページに28日で2人。
#     フィードは収入にも商品にも変換できない面で、そこに何再生積んでも出口が無い。
#
# **在庫はもう対になっている。繋いでいないだけ。** 追加の制作費はゼロ。
#
# ## 選び方
#
# **同じ題材の公開済み長尺があるものだけ。** 「近い」では入れない。
# 副業のショートに年金の長尺を出しても、押す理由が無い。
#
# ## 入れないもの（2026-08-10 時点）
#
#     gPusj-Y2404  医療費控除      対応する長尺が無い
#     UTwBchk3OX0  医療費控除      同上
#     eDhsTuVyVAw  障害者控除      P5yRTOMRulc（所得控除）は題材が違う。近いだけ
#     Z9gy1rw9TOA  地震保険料控除  同上
#     hiTMix1eNxc  特定扶養控除    同上
#
# **「近い」を入れないのは、押されなかったときに理由が分けられなくなるから。**
# 導線が効かないのか、題材が合っていないのかが混ざる。
#
# ## 公開済みショートに入れない理由
#
# ショートの配信は48時間で完全に止まる（実測・確認済み）。
# **8/9 以前のショートに入れても、新しく見る人がいない。**
# 入れるのは**これから公開されるもの**だけ。

