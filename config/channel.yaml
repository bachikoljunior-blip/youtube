# =============================================================================
# チャンネル設定 — 広告収益の最大化を目標にチューニング済み
#
# 収益 = 再生数 × RPM。RPM はニッチで 10 倍以上変わるため、
# 「何を出すか」がここでほぼ決まる。詳細は docs/STRATEGY.md
# =============================================================================

channel:
  # 日本語の高RPMニッチ（金融/ビジネス/キャリア）を既定にしている。
  # 変えるなら docs/STRATEGY.md の RPM 表を見てから変える。
  name: "お金と仕事の教科書"
  niche: "日本の会社員向けの、お金・税金・キャリアの実務解説"
  audience: "25〜49歳の日本の会社員・個人事業主。数字と手順が知りたい実務家層"
  language: "ja"

  # 台本の書き手としての立場。
  #
  # **2026-08-30 に書き換えた。ここが停止の原因そのものでした。**
  #
  # それまでの本文（記録として残す。**戻さないこと**）:
  #     元・事業会社の経理／人事で、制度を実務で回してきた立場から解説する。
  #
  # `AUTOMATION_PAUSED.md` は、オーナーが 08/30 に直接 push したもので、
  # 解除条件の 1番 と 2番 がこの3行を名指ししています。
  #
  #     1. sensitive-topic AI persona を使わない
  #     2. human expert を装わない
  #
  # **実在しない人間の実務経歴**を名乗り、税・保険・雇用の話をする ——
  # `CLAUDE.md` が「手段として成立しない」と書いている **なりすまし** に当たり、
  # YouTube のチャンネル収益化ポリシーが収益化不可として挙げる
  # 「AI generated personas presenting themselves as human experts on
  #  sensitive topics」そのものです。**収益化されなければ収入は 0 円**なので、
  # これは危険度の話ではなく、到達可能性そのものの話です。
  #
  # 置き換えた先は「別の肩書き」ではありません。**肩書きを持たないこと**です。
  # `CLAUDE.md` の根幹（2026-08-04）が既にそう言っています ——
  # **「制度を解説するのではなく、自分で計算した結果を発表する」**。
  # 計算の主体に経歴は要りません。要るのは**前提と式が画面に出ていること**で、
  # 独自性はそこ（前提の置き方）から出ます。
  #
  # **覆る条件**: `tests/test_persona_not_human_expert.py` が門です。
  # 経歴・資格・年数・一人称の実務体験を名乗る語が入ったら赤くなります。
  # ポリシー側が変わってこの制約が外れたら、その検査ごと消してよい。
  persona: |
    人ではなく、公開されている制度の条文と数値から計算する道具として話す。
    経歴・資格・実務経験・肩書きを名乗らない。現場で扱った、担当していた、
    という一人称の体験談を書かない。相談への回答や助言の形にしない。
    代わりに毎回、置いた前提と計算式をそのまま出し、視聴者が同じ数字を
    自分で出し直せる形にする。出典が取れない数字は使わない。
    煽らない。断定できないことは断定しない。数字と条件を先に出す。
    結論は「この前提ならこの金額になる」までにとどめ、
    「あなたはこうすべき」まで踏み込まない。

  # 絶対に扱わない領域（YouTube のポリシー違反・広告非表示リスクの回避）
  avoid:
    - "個別銘柄の売買推奨、投資勧誘"
    - "確実に儲かる/絶対などの断定表現"
    - "医療・健康の助言"
    - "扇情的なサムネ・タイトル（クリックベイト）"
    - "特定の個人・企業への批判"
    # **2026-08-30 に足した3件**（`AUTOMATION_PAUSED.md` の解除条件 1・2）。
    - "書き手を人間として語ること（経歴・資格・実務年数・一人称の体験談）"
    - "個別の事情への助言・相談回答の形（「あなたの場合は」「〜すべき」）"
    - "専門家の見解として述べること（税理士・社労士・FP などの立場の借用）"

# ---------------------------------------------------------------------------
# 動画フォーマット
# ---------------------------------------------------------------------------
video:
  # 8分超で初めてミッドロール広告を複数入れられる。収益の要。
  # **2026-08-09、10分 → 6分に変えた。**
  # それまで min 8.5分だったのは**ミッドロール広告の下限**に合わせたため。
  # だが**収益化まであと登録者999人**で、広告は1円も出ていない。
  # **通っていない門のために、いまの検索性能と維持率を犠牲にしていた。順番が逆。**
  # 検索向けの目安は4〜7分（docs/SEARCH_TERMS.md）。
  # **収益化が見えたら8分に戻すか検討すること。**
  target_minutes: 6
  min_minutes: 4.0          # これを下回ったら台本を書き直させる
  resolution: [1920, 1080]
  fps: 30

  # 冒頭15秒で離脱を防ぐ。視聴維持率は RPM にも効く。
  hook_seconds: 15

# ---------------------------------------------------------------------------
# 投稿スケジュール
# ---------------------------------------------------------------------------
publish:
  # 動作確認が済むまでは private。数本チェックして問題なければ public に変える。
  visibility: "private"      # private | unlisted | public
  category_id: "27"          # 27 = Education
  made_for_kids: false

  # 予約投稿する時刻（JST）。日本の視聴ピークは 19-22時。
  # 公開の30分〜数時間前にアップロードが完了しているのが理想。
  publish_hour_jst: 19
  publish_minute_jst: 0

  # 投稿後にこの再生リストへ自動で追加する（無ければ作る）。空にすると追加しない。
  # 再生リストに入っていると次の動画へ流れやすく、セッション視聴時間が伸びる。
  playlist: "お金と仕事の手続き"

  # 説明欄の末尾に必ず入る定型文
  footer: |

    ─────────────
    ※ この動画は一般的な情報提供を目的としたもので、個別の助言ではありません。
    　 制度は改正されます。実行前に必ず公式情報・専門家にご確認ください。

# ---------------------------------------------------------------------------
# 生成系の設定
# ---------------------------------------------------------------------------
generation:
  # Claude Code CLI に渡すモデル。サブスクの契約内で動く。
  # opus / sonnet / haiku のエイリアスが使える。台本の質が収益に直結するので opus 推奨。
  # 利用上限に当たりやすい場合は sonnet に落とす。
  model: "opus"

  tts:
    # google     … Cloud Text-to-Speech。GOOGLE_TTS_API_KEY が要るが、声は明確に自然。
    # open-jtalk … apt で入る。鍵も課金設定も不要。声はやや機械的。
    # google を指定してキーが無ければ、自動で open-jtalk に落ちる。
    # 声は視聴維持率を通して収益に効くので、続ける気があるならキーを足す価値がある。
    engine: "google"
    voice: "ja-JP-Neural2-D"   # google のときだけ使う。-B は女性
    speaking_rate: 1.08        # 少し速いほうが視聴維持率が上がる
    pitch: 0.0
