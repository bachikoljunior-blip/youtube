# =============================================================================
# チャンネル設定 — 広告収益の最大化を目標にチューニング済み
#
# 収益 = 再生数 × RPM。RPM はニッチで 10 倍以上変わるため、
# 「何を出すか」がここでほぼ決まる。詳細は docs/STRATEGY.md
# =============================================================================

channel:
  # 日本語の高RPMニッチ（金融/ビジネス/キャリア）を既定にしている。
  # 変えるなら docs/STRATEGY.md の RPM 表を見てから変える。
  name: "お金と仕事の教科書"
  niche: "日本の会社員向けの、お金・税金・キャリアの実務解説"
  audience: "25〜49歳の日本の会社員・個人事業主。数字と手順が知りたい実務家層"
  language: "ja"

  # 台本の書き手としての人格。ここが動画の個性になる。
  persona: |
    元・事業会社の経理／人事で、制度を実務で回してきた立場から解説する。
    煽らない。断定できないことは断定しない。数字と条件を先に出す。
    「結局いくら得か」「明日何をすればいいか」を必ず示す。

  # 絶対に扱わない領域（YouTube のポリシー違反・広告非表示リスクの回避）
  avoid:
    - "個別銘柄の売買推奨、投資勧誘"
    - "確実に儲かる/絶対などの断定表現"
    - "医療・健康の助言"
    - "扇情的なサムネ・タイトル（クリックベイト）"
    - "特定の個人・企業への批判"

# ---------------------------------------------------------------------------
# 動画フォーマット
# ---------------------------------------------------------------------------
video:
  # 8分超で初めてミッドロール広告を複数入れられる。収益の要。
  target_minutes: 10
  min_minutes: 8.5          # これを下回ったら台本を書き直させる
  resolution: [1920, 1080]
  fps: 30

  # 冒頭15秒で離脱を防ぐ。視聴維持率は RPM にも効く。
  hook_seconds: 15

# ---------------------------------------------------------------------------
# 投稿スケジュール
# ---------------------------------------------------------------------------
publish:
  # 動作確認が済むまでは private。数本チェックして問題なければ public に変える。
  visibility: "private"      # private | unlisted | public
  category_id: "27"          # 27 = Education
  made_for_kids: false

  # 予約投稿する時刻（JST）。日本の視聴ピークは 19-22時。
  # 公開の30分〜数時間前にアップロードが完了しているのが理想。
  publish_hour_jst: 19
  publish_minute_jst: 0

  # 説明欄の末尾に必ず入る定型文
  footer: |

    ─────────────
    ※ この動画は一般的な情報提供を目的としたもので、個別の助言ではありません。
    　 制度は改正されます。実行前に必ず公式情報・専門家にご確認ください。

# ---------------------------------------------------------------------------
# 生成系の設定
# ---------------------------------------------------------------------------
generation:
  # Claude Code CLI に渡すモデル。サブスクの契約内で動く。
  # opus / sonnet / haiku のエイリアスが使える。台本の質が収益に直結するので opus 推奨。
  # 利用上限に当たりやすい場合は sonnet に落とす。
  model: "opus"

  tts:
    # google     … Cloud Text-to-Speech。GOOGLE_TTS_API_KEY が要るが、声は明確に自然。
    # open-jtalk … apt で入る。鍵も課金設定も不要。声はやや機械的。
    # google を指定してキーが無ければ、自動で open-jtalk に落ちる。
    # 声は視聴維持率を通して収益に効くので、続ける気があるならキーを足す価値がある。
    engine: "google"
    voice: "ja-JP-Neural2-D"   # google のときだけ使う。-B は女性
    speaking_rate: 1.08        # 少し速いほうが視聴維持率が上がる
    pitch: 0.0
