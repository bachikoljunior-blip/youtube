# =============================================================================
# チャンネル設定 — 広告収益の最大化を目標にチューニング済み
#
# 収益 = 再生数 × RPM。RPM はニッチで 10 倍以上変わるため、
# 「何を出すか」がここでほぼ決まる。詳細は docs/STRATEGY.md
# =============================================================================

channel:
  # 日本語の高RPMニッチ（金融/ビジネス/キャリア）を既定にしている。
  # 変えるなら docs/STRATEGY.md の RPM 表を見てから変える。
  name: "お金と仕事の教科書"
  niche: "日本の会社員向けの、お金・税金・キャリアの実務解説"
  audience: "25〜49歳の日本の会社員・個人事業主。数字と手順が知りたい実務家層"
  language: "ja"

  # 台本の書き手としての人格。ここが動画の個性になる。
  #
  # **2026-08-30、「元・事業会社の経理／人事」を落とした**
  # （`AUTOMATION_PAUSED.md` の Resume gate 1・2）。
  #
  # 旧版はこう書いてあった:
  #     元・事業会社の経理／人事で、制度を実務で回してきた立場から解説する。
  #
  # **そんな人はいません。** 合成音声が、型どおりの生成で、税・保険・キャリアという
  # **視聴者が自分の金で動く題**を、**実在しない人間の実務経歴を根拠に**話す形で、
  # YouTube が収益化不可として名指ししている
  # 「AI persona が人間の専門家として sensitive topic を説明する」そのものだった。
  # `CLAUDE.md` が手段として成立しないと書いている2つの片方（なりすまし）でもある。
  #
  # **落としたのは経歴であって、企画ではありません。**
  # 「制度を解説するのではなく、自分で計算した結果を発表する」（`CLAUDE.md` の根幹）は、
  # 架空の実務経歴を1文字も必要としない —— 「元・経理」をやめても
  # `src/calc/` が出す数字は1つも減りません。
  #
  # **ここを直しただけでは閉じません。** 人格は台本を書かせる指示文の一部でしかなく、
  # 書き手がここに無い経歴を勝手に足すことがあります。だから
  # `src/verify._check_no_human_expert_claim()` が**出来上がった台本の側**でも同じものを塞ぎ、
  # レンダリングの前に落とします（検査は `tests/test_no_human_expert_claim.py`）。
  #
  # **覆る条件**: 実在する人間が実名で出演し、その経歴が事実であるなら、
  # この節ごと書き換えてよい（そのときは「装う」に当たらない）。
  persona: |
    肩書きも経歴も資格も名乗らない。一人称で職業や勤続年数を語らない。
    自分を専門家だと言わない（実在の経歴が1つも無いので、書けば嘘になる）。
    根拠にするのは経験ではなく、その回に自分で置いた前提と、そこから引いた計算式そのもの。
    前提と条件を先に出し、断定できないことは断定しない。煽らない。
    助言ではなく試算として書く（「あなたはこうすべき」ではなく、
    「この前提で計算するとこうなる。条件が変わればこう変わる」）。
    「結局いくらか」と「どこを確かめれば自分の場合の数字が出るか」を必ず示す。

  # 絶対に扱わない領域（YouTube のポリシー違反・広告非表示リスクの回避）
  avoid:
    - "個別銘柄の売買推奨、投資勧誘"
    - "確実に儲かる/絶対などの断定表現"
    - "医療・健康の助言"
    - "扇情的なサムネ・タイトル（クリックベイト）"
    - "特定の個人・企業への批判"
    # **2026-08-30 に足した3件**（`AUTOMATION_PAUSED.md` の解除条件 1・2）。
    - "書き手を人間として語ること（経歴・資格・実務年数・一人称の体験談）"
    - "個別の事情への助言・相談回答の形（「あなたの場合は」「〜すべき」）"
    - "専門家の見解として述べること（税理士・社労士・FP などの立場の借用）"

# ---------------------------------------------------------------------------
# 動画フォーマット
# ---------------------------------------------------------------------------
video:
  # 8分超で初めてミッドロール広告を複数入れられる。収益の要。
  # **2026-08-09、10分 → 6分に変えた。**
  # それまで min 8.5分だったのは**ミッドロール広告の下限**に合わせたため。
  # だが**収益化まであと登録者999人**で、広告は1円も出ていない。
  # **通っていない門のために、いまの検索性能と維持率を犠牲にしていた。順番が逆。**
  # 検索向けの目安は4〜7分（docs/SEARCH_TERMS.md）。
  # **収益化が見えたら8分に戻すか検討すること。**
  target_minutes: 6
  min_minutes: 4.0          # これを下回ったら台本を書き直させる
  resolution: [1920, 1080]
  fps: 30

  # 冒頭15秒で離脱を防ぐ。視聴維持率は RPM にも効く。
  hook_seconds: 15

# ---------------------------------------------------------------------------
# 投稿スケジュール
# ---------------------------------------------------------------------------
publish:
  # 動作確認が済むまでは private。数本チェックして問題なければ public に変える。
  visibility: "private"      # private | unlisted | public
  category_id: "27"          # 27 = Education
  made_for_kids: false

  # 予約投稿する時刻（JST）。日本の視聴ピークは 19-22時。
  # 公開の30分〜数時間前にアップロードが完了しているのが理想。
  publish_hour_jst: 19
  publish_minute_jst: 0

  # 投稿後にこの再生リストへ自動で追加する（無ければ作る）。空にすると追加しない。
  # 再生リストに入っていると次の動画へ流れやすく、セッション視聴時間が伸びる。
  playlist: "お金と仕事の手続き"

  # 説明欄の末尾に必ず入る定型文
  #
  # **2026-08-31、合成音声の開示を足した**（最適化の回）。
  #
  # 08-30 に閉じたのは**名乗り**のほう（`persona` から経歴を落とし、
  # `src/verify._check_no_human_expert_claim()` が出口でも塞ぐ）。
  # **「名乗らない」と「何であるかを言う」は別のことです。**
  # 前者は閉じていましたが、**説明欄のどこにも合成音声だと書いていませんでした。**
  #
  # 合成メディアの開示は YouTube の要求事項で、無開示は審査で不利にしか働かない。
  # **そして説明欄は再生時間に入らないので、尺も維持率も1秒も削りません** ——
  # 到達日に対して、払う代償が無い側の手です。
  # `src/eligibility.py` がこの欄を見張っていて、開示が消えると
  # `scripts/eta.py` の段3 が **15日 後ろへ動きます**（黙って消せない）。
  footer: |

    ─────────────
    ※ ナレーションは合成音声です。台本と図表は自動生成しています。
    　 特定の資格保有者による監修は受けていません。
    ※ この動画は一般的な情報提供を目的としたもので、個別の助言ではありません。
    　 制度は改正されます。実行前に必ず公式情報・専門家にご確認ください。

# ---------------------------------------------------------------------------
# 生成系の設定
# ---------------------------------------------------------------------------
generation:
  # Claude Code CLI に渡すモデル。サブスクの契約内で動く。
  # opus / sonnet / haiku のエイリアスが使える。台本の質が収益に直結するので opus 推奨。
  # 利用上限に当たりやすい場合は sonnet に落とす。
  model: "opus"

  tts:
    # google     … Cloud Text-to-Speech。GOOGLE_TTS_API_KEY が要るが、声は明確に自然。
    # open-jtalk … apt で入る。鍵も課金設定も不要。声はやや機械的。
    # google を指定してキーが無ければ、自動で open-jtalk に落ちる。
    # 声は視聴維持率を通して収益に効くので、続ける気があるならキーを足す価値がある。
    engine: "google"
    voice: "ja-JP-Neural2-D"   # google のときだけ使う。-B は女性
    speaking_rate: 1.08        # 少し速いほうが視聴維持率が上がる
    pitch: 0.0
