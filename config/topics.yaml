  # **書き換えた（2026-08-09）。** 元は「年収交渉で通る言い方」という助言もので、
  # 計算が無く、**数字を発明させるしかないので一度も使えなかった。**
  # 加えて、ああいう一般論はポリシーの「自分で作成していない資料の読み上げ」側に
  # 落ちる。`src/calc/tedori.py` を書いたので、計算の発表に置き換える。
  - id: tenshoku-nenshu
    title_seed: "年収660万円 給与所得控除の段差 昇給10万円で残るのは6万2185円"
    calc_sections:
      - "段差は2つ"
      - "年収べつの手取り"
      - "この計算の前提"
    angle: >
      **検索から来る人に向けた長尺（4〜7分）。**
      狙う検索語は「年収50万円上がったら手取りはいくら増える」と
      **「年収660万円 給与所得控除」**。
      **タイトル前半に検索語をそのまま置く。**

      **狙いを変えた（2026-08-09、M6 で競合を測った結果）。**
      「年収 上がっても 手取り 増えない」は**やや厚い**、
      「昇給 手取り いくら増える」は**中程度で、税理士法人の
      「年収100万円上がったら手取りはいくら増える？」がほぼ同じ企画**。
      いっぽう **「年収660万円 給与所得控除」は薄い**（大手が660万円の段差を
      正面から扱った形跡が乏しい）と評価された。**薄いほうに寄せる。**

      答える問いは1つ。**年収を50万円上げたとき、手取りは何円増えるのか。**
      出回っているのは年収ごとの手取り額の一覧で、**上げたぶんが何円残るか**の
      表はほとんど無い。転職や昇給の判断に要るのは後者のほう。

      **一番の見どころは、段差が2つ続けて来ること。**
      10万円刻みで引くと、残る割合は **71.9% → 65.2% → 62.2%** と2段で落ちる。

          年収およそ645万円  所得税率が10%から20%へ（課税所得が330万円を超える）
          年収      660万円  給与所得控除の伸びが10万円あたり2万円から1万円へ

      **「660万円の壁」で説明できるのは落差の半分だけです。**
      大きいほうの段は、その手前の所得税率。**ここを混ぜたら誤情報になります。**
      渡された表の `原因` 列をそのまま使うこと。

      **言い方を間違えないこと。660万円で控除額が減るのではない。**
      額は連続していて、どちらの式でも176万円。変わるのは**増え方**だけ。
      **「660万円を超えると控除が減る」も「1円超えると損」も誤り**
      （手取りは必ず増える）。使わないこと。

      **chart に使う数字は「年収べつの手取り」と「段差は2つ」の表から取ること。**
      「50万円上げたとき」の表の棒は**ショートで既に出しています**（8/16 公開）。

      **煽らない。** 「働き損」とは言わない。**どの帯でも手取りは必ず増える**
      （残る割合は62〜77%で、0にも負にもならない）。そこは明言すること。

      **50万円刻みの表はプロンプトに渡していません**（`calc_sections` で外した）。
      ショート `s-tedori-1` が 38万3461円・35万9318円・31万925円 と
      76.7%・71.9%・62.2% を既に図に出しているためです。
      **渡した節の中だけで組み立ててください。**

      **「残る割合」のパーセントは chart にしないこと。ここは例外なく守る。**
      71.9% と 62.2% は**ショートの棒とそのまま重なり**、2本一致で検査に落ちます。
      割合は**話してよいし、table や stat で出すのもよい。棒グラフにしないだけ。**

      **chart（棒グラフ）に使ってよいのは、次の3つの列だけです。**

          「段差は2つ」の表の **手取り増**（7万1864円・7万1353円・6万5227円・6万2185円）
          「年収べつの手取り」の **手取り**
          「年収べつの手取り」の **所得税** か **社会保険料**

      chart は3枚以上要るので、上の3つで足ります。
    calc: tedori
    score: 1.9

