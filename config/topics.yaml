  # まだ一度も出していない。
  - id: kojo-shogaisha
    title_seed: "同居特別障害者控除の申告漏れは5年さかのぼって取り返せる"
    angle: >
      **「取り返せる」×「金額が大きい」を狙った回。** 実績上いちばん強い言い方が
      「5年戻せる」（8/7・1508再生）なので、そこを冒頭に置く。
      **冒頭は税率20%・同居特別障害者控除の5年分（103万750円）。** 7桁が出る唯一の切り口。

      中身は「扶養控除に上乗せされる額が控除ごとに違う」こと。
      **よくある誤りは「控除額 × 所得税率」だけで計算すること**で、
      住民税ぶん（障害者控除は所得税と住民税で控除額そのものが違う）が抜ける。
      calc が出す「よく見る計算」との差額をそのまま出す。

      **扱いに気をつけること。** 制度の対象になる人の事情に踏み込まない。
      出すのは金額と適用条件だけ。煽らない。「知らないと損」のような言い方をしない。
      chart は税率べつ（5/10/20%）の5年分と、控除べつの合計額で最低3枚。
    calc: kojo
    score: 1.7

  # furusato の計算で**まだ一度も使っていない列**がある。
  # 既存3本はすべて「社会保険料率」と「年収べつ・独身」で、
  # **独身と『配偶者＋扶養1人』の差**は出していない。
