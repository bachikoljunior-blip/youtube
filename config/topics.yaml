  # これは目安表を見ても分からない（表は年収と家族構成の組で出ているだけで、
  # 「差がほぼ一定」とはどこにも書いていない）。
  - id: furusato-fuyou
    title_seed: "ふるさと納税 扶養が1人増えると上限は年収に関係なく約2万円下がる"
    angle: >
      **「差がほぼ一定」という発見そのものを出す回。**
      冒頭は「扶養1人で上限がいくら下がるか」の金額（年収600万で1万6544円）。

      中身は、年収300万から1200万まで**4倍になっても差は1.5〜2万円のまま**という事実。
      上限額そのものは 2万8856円→23万7127円 と8倍以上になるのに、
      **差だけが動かない。** これが独自の発見で、目安表からは読み取れない。

      理由も出す。扶養控除で住民税の所得割が下がり、上限は所得割に比例するので、
      **控除額が同じなら下がり幅もほぼ同じ**になる。

      chart は最低3枚。(1)年収べつの上限（独身と扶養1人を並べる）、
      (2)年収べつの「差」だけを並べて平らなことを見せる、(3)所得割の差。
      **既存3本は料率と独身の上限しか出していないので、棒の数値は重ならない。**
    calc: furusato
    score: 1.6

  # jutaku の計算で**まだ使っていない表**が13年通算。
  # 8/8 に「課税所得150万だと年6万円戻らない」を出したが（438再生）、
  # **13年通算で見ると取りこぼしはほぼ消える**（課税所得200万で0.2%、300万で0%）。
  # 残高が毎年減るので、控除可能額が住民税の上限に収まっていくため。
  # **自分の過去回の数字を、自分の計算で捉え直す回。** どこにも出ていない。
  - id: jutaku-13nen
    title_seed: "住宅ローン控除 1年で見ると損に見えるが13年通算だとほぼ取り切れる"
    angle: >
      **「1年と13年で結論が変わる」ことを出す回。**
      冒頭は13年通算の取りこぼし額（課税所得200万で4963円）。
      **これは小さい数字だが、それが結論**なので冒頭に置く。

      構成は、まず1年だけ見たときの取りこぼし（課税所得150万で6万円）を出し、
      **次に13年通算にすると4963円まで縮む**ことを見せる。
      理由は残高が毎年減ること。控除可能額が下がっていき、
      住民税の上限に収まるようになる。

      **「1年の数字だけ見て損だと判断すると間違える」が言いたいこと。**
      煽らない。制度が悪いとも良いとも言わない。数字だけ出す。

      chart は最低3枚。(1)課税所得べつの1年の取りこぼし、
      (2)同じ条件の13年通算の取りこぼし、(3)年ごとの残高の減り方。
      **既存2本は1年ぶんの表しか出していないので、13年通算の棒は重ならない。**
    calc: jutaku
    score: 1.6
