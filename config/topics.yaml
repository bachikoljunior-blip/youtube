- id: ideco-vs-nisa
  title_seed: iDeCoの掛金を3倍にすると得が54,704円減る
  angle: '**入口だけを見た解説の続きを計算する。** 「掛金が全額所得控除だから iDeCo が先」で 止まるのは、**出口の税を数えていないから**。iDeCo
    は受け取るときに退職所得として 課税され、新NISA は1円もかからない。差は **1,060,896円 ＝ 2,853,120円 − 1,792,224円**（自営業の上限・20年・利回り3パーセント）。
    **式を画面に出すときは、必ずこの数の入った形にすること。記号だけの式を出さない。** 退職所得控除は年数に比例して伸びるだけなのに、残高は利回りで指数に膨らむので、
    **追い越した時点から得が減る。** 会社員の上限では 40年掛けても出口の税は0円だが、 利回りが 3.5パーセント を超えると出はじめる。自営業の上限では**利回り0でも出る**ため、
    掛金を 2.9565217391304346倍 にすると得が 1,115,600円 → 1,060,896円 と減る。 前提（年収・利回り・受け取りが iDeCo
    一本）は画面に全部出す

    '
