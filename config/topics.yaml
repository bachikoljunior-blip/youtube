  # jutaku-13nen は**取り下げた**（2026-08-09）。
  # 「13年通算の表はまだ使っていない」と書いてテーマを足したが、**事実に反していた。**
  # s-jutaku-1 が既に 224万7758円・225万2721円 を出しており、
  # 取りこぼしが出はじめる残高（2142万・2857万・4285万・6714万）も使っていた。
  # 棒が3本共通で `verify` の反復検査に落ちた。
  #
  # **確認したつもりで、出力を head で切っていた。** 見えていない行を「無い」と
  # 断定した。**「使っていない」と言う前に、全部を見ること。**
  # jutaku の計算はショート向けには使い切っている。

  # 新しい計算モジュール src/calc/fukugyo.py（2026-08-09）。
  # withheld.yaml が「fukugyo は calc が無いので長尺を伏せる」と書いていた穴を埋めた。
  # 出てくる数字が強い: 20万円→20万1円 で税額が 1万〜6万7千円 跳ぶ。
  # 手取りが元に戻るのは 21万2027円〜31万9677円。**どこにも出ていない。**
  - id: fukugyo-20man
    title_seed: "副業20万円ルール 1円超えると手取りが戻るまで12万円必要"
    angle: >
      **境界で金額が飛ぶことを出す回。** このチャンネルで一番効く型。
      冒頭は「20万1円にすると税額がいくら跳ぶか」の最大値（税率33%で6万7386円）。

      言いたいことは2つ。
      1. **20万円以下でも住民税はかかる。** 20万円ルールは所得税だけで、
         住民税には無い。20万円ちょうどでも住民税2万円。「申告不要＝無税」ではない
      2. **20万円を1円超えると、超過分ではなく全額に所得税がかかる。**
         だから手取りが減る。元の手取りに戻るには、税率10%で22万5593円、
         33%なら31万9677円まで稼ぐ必要がある

      **煽らない。** 制度が理不尽だとは言わない。数字と適用条件だけ出す。
      「知らないと損」も使わない。

      chart は最低3枚。(1)税率べつの跳ぶ額、(2)税率べつの「手取りが戻る所得」、
      (3)副業所得べつの手取り（20万円と20万1円を並べて減ることを見せる）。
    calc: fukugyo
    score: 1.8

  # **検索流入向けの1本目**（2026-08-09）。`docs/SEARCH_TERMS.md` から選んだ。
  # 「副業 20万円 経費 含む」「副業 20万円以下 住民税 いくら」は
  # **競合が薄い**と判定された語。どちらも calc(fukugyo) で数字が出る。
  # **1動画1クエリ。タイトル前半に検索語をそのまま置く。**
  - id: fukugyo-keihi-search
    title_seed: "副業20万円ルールは売上か所得か 経費を引いた額で判定する"
    angle: >
      **検索から来る人に向けた長尺（4〜7分）。** ショートとは作りが違う。

      狙う検索語は「副業 20万円 経費 含む」と「副業 20万円以下 住民税 いくら」。
      **タイトルの前半に検索語をそのまま置く。** 冒頭15秒でも同じ語を発話し、
      結論の数字を言う。

      答える問いは2つ。
      1. **20万円は売上ではなく所得**（収入−必要経費）で判定する。
         売上30万・経費12万なら所得18万で、確定申告は不要になる
      2. **それでも住民税は申告が要る。** 20万円ルールは所得税だけ。
         所得18万なら住民税は1万8000円

      calc(fukugyo) が出す表をそのまま使う。売上と経費の組み合わせべつに、
      所得・所得税・住民税・手取りを並べる。**境界のすぐ上と下も入れる。**

      **煽らない。** 「知らないと損」は使わない。脱税の示唆もしない。
      経費として認められる範囲の判断には踏み込まず、**金額の計算だけ**を出す。
    calc: fukugyo
    score: 1.9
