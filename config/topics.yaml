      calc が出す「よく見る計算」との差額をそのまま出す。

      **扱いに気をつけること。** 制度の対象になる人の事情に踏み込まない。
      出すのは金額と適用条件だけ。煽らない。「知らないと損」のような言い方をしない。
      chart は税率べつ（5/10/20%）の5年分と、控除べつの合計額で最低3枚。
