# score は optimize ワークフロー（週1）が YouTube Analytics の実績を見て
# 自動で更新する。手で足すのも歓迎 — 手で足したネタのほうが強いことが多い。
#
# score: 1.0 が初期値。実績が良かったテーマの近傍が上がっていく。
# =============================================================================

