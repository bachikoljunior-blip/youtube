# **`calc:` の無いテーマは、まだ使えません。**
#
# この作りの根幹は「制度を解説せず、自分で計算した結果を発表する」こと。
# 計算が無いテーマで台本を書かせると、**数字を発明させる**ことになる。
# `script_writer.calc_block` が止めるので事故にはならないが、
# **この一覧を見ただけでは分からない**ので印を書いておく。
#
# 2026-08-05: 計算が空でも素通りしていた穴を塞いだ（kojo・shitsugyo・zangyo は
# `__main__` が無く、出力が空のまま台本を書かせていた）。
# `AZcO9irdlxg`（副業20万円ルール）はその時期に作った長尺で、private のまま置いてある。
#
# 使うには先に `src/calc/<名前>.py` を書き、`python -m src.calc.<名前>` で
# 表が出ることを確かめること。**関数を定義しただけでは出力は空。**

# =============================================================================
# トピックプール
#
# pipeline は未投稿のものから選ぶ。投稿済みかどうかは YouTube 側の
